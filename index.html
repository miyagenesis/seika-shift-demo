<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>特養さくら苑 勤務表・勤怠（KOTなし版）</title>
<style>
/* ShiftCraft 業務画面。読むページではなく操作する画面なので、
   情報密度を優先し、状態は色だけでなく形（ピル・記号）でも示す。 */
:root {
  --ground:  #F4F3F0;
  --surface: #FFFFFF;
  --raised:  #FAF9F7;
  --border:  #E1DFD9;
  --border-strong: #C9C6BE;
  --ink:     #1A1C20;
  --ink-2:   #4A4E55;
  --ink-3:   #767B83;
  --accent:  #1B4A6B;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7EEF4;
  --good:    #1B6F5E;
  --good-soft: #E3F0EC;
  --warn:    #9A5B00;
  --warn-soft: #FBEEDC;
  --bad:     #A72316;
  --bad-soft: #FBE7E4;
  --shadow:  0 1px 2px rgba(20,22,26,.06), 0 4px 14px rgba(20,22,26,.05);
  --radius: 8px;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --sans: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:  #131519;
    --surface: #1B1E23;
    --raised:  #22262C;
    --border:  #31353C;
    --border-strong: #464C55;
    --ink:     #E9E7E2;
    --ink-2:   #B3B8C0;
    --ink-3:   #838A94;
    --accent:  #74A9CC;
    --accent-ink: #10151A;
    --accent-soft: #1F2E3A;
    --good:    #63C3AC;
    --good-soft: #16302B;
    --warn:    #DFA65A;
    --warn-soft: #33270F;
    --bad:     #E88C80;
    --bad-soft: #38201C;
    --shadow:  0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground:  #131519;
  --surface: #1B1E23;
  --raised:  #22262C;
  --border:  #31353C;
  --border-strong: #464C55;
  --ink:     #E9E7E2;
  --ink-2:   #B3B8C0;
  --ink-3:   #838A94;
  --accent:  #74A9CC;
  --accent-ink: #10151A;
  --accent-soft: #1F2E3A;
  --good:    #63C3AC;
  --good-soft: #16302B;
  --warn:    #DFA65A;
  --warn-soft: #33270F;
  --bad:     #E88C80;
  --bad-soft: #38201C;
  --shadow:  0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}


* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: .01em; }
a { color: var(--accent); }

/* ---- ログイン ---- */
.login-wrap { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
.login-card {
  width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 32px; box-shadow: var(--shadow);
}
.login-card h1 { font-size: 22px; margin-bottom: 4px; }
.login-card .sub { color: var(--ink-3); font-size: 13px; margin-bottom: 24px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.field input, .field select, .field textarea {
  padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: 6px;
  background: var(--surface);
}
.field input:focus-visible, .field select:focus-visible, button:focus-visible,
td.cell:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.hint-users {
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--ink-3);
}
.hint-users code { font-family: var(--mono); color: var(--ink-2); }

/* ---- 骨格 ---- */
.app { display: grid; grid-template-columns: 208px 1fr; min-height: 100vh; }
.side {
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }
.brand .name { font-weight: 700; font-size: 15px; letter-spacing: .04em; }
.brand .facility { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.nav { padding: 10px; display: grid; gap: 2px; }
.nav button {
  text-align: left; padding: 9px 12px; border: 0; background: none; border-radius: 6px;
  cursor: pointer; color: var(--ink-2); font-size: 13.5px;
}
.nav button:hover { background: var(--raised); color: var(--ink); }
.nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.side-foot { margin-top: auto; padding: 14px; border-top: 1px solid var(--border); font-size: 12px; }
.side-foot .who { color: var(--ink-2); }
.side-foot .role { color: var(--ink-3); font-size: 11px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 12px 22px;
  background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
}
.topbar h2 { font-size: 16px; }
.spacer { margin-left: auto; }
.content { padding: 22px; display: grid; gap: 18px; align-content: start; }

/* ---- 部品 ---- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card > header {
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.card > header h3 { font-size: 13.5px; }
.card > header .note { font-size: 12px; color: var(--ink-3); }
.card .body { padding: 16px; }
.card .body.tight { padding: 0; }

button.btn {
  padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border-strong);
  background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 600;
}
button.btn:hover { background: var(--raised); }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.btn.primary:hover { filter: brightness(1.08); }
button.btn.sm { padding: 5px 10px; font-size: 12px; font-weight: 500; }
button.btn:disabled { opacity: .5; cursor: not-allowed; }

.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700; border: 1px solid transparent; white-space: nowrap;
}
.pill.ok   { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.pill.bad  { background: var(--bad-soft);  color: var(--bad);  border-color: var(--bad); }
.pill.mute { background: var(--raised); color: var(--ink-3); border-color: var(--border); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.kpi .label { font-size: 11.5px; color: var(--ink-3); }
.kpi .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .unit { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.kpi .sub { font-size: 11.5px; color: var(--ink-3); }

table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; }
table.data th { font-size: 11.5px; color: var(--ink-3); font-weight: 600; background: var(--raised); }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
.scroll { overflow-x: auto; }

/* ---- 勤務表グリッド ---- */
.grid-wrap { overflow: auto; max-height: 68vh; }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 12px; }
table.grid th, table.grid td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
table.grid thead th {
  position: sticky; top: 0; z-index: 3; background: var(--raised); padding: 4px 2px;
  font-size: 10.5px; color: var(--ink-3); font-weight: 600; min-width: 28px; text-align: center;
}
table.grid thead th.sat { color: #1F6FEB; }
table.grid thead th.sun { color: var(--bad); }
table.grid th.name {
  position: sticky; left: 0; z-index: 4; background: var(--surface); text-align: left;
  padding: 4px 10px; min-width: 108px; font-size: 12px; color: var(--ink); font-weight: 500;
}
table.grid thead th.name { z-index: 5; }
table.grid td.cell {
  width: 28px; height: 26px; text-align: center; cursor: pointer; position: relative;
  font-weight: 600; color: #17191C; background: var(--surface);
}
table.grid td.cell[data-locked="1"]::after {
  content: ""; position: absolute; inset: 0; border: 2px solid var(--accent); pointer-events: none;
}
table.grid td.cell.req::before {
  content: ""; position: absolute; left: 2px; top: 2px; width: 4px; height: 4px;
  border-radius: 50%; background: var(--ink);
}
table.grid td.cell.unmet { box-shadow: inset 0 0 0 2px var(--bad); }
table.grid tr:hover td.cell { filter: brightness(.97); }

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--ink-2); padding: 10px 16px; }
.legend .sw { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid rgba(0,0,0,.12); }

/* ---- 希望休の集中度 ---- */
.crowd { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 4px; }
.crowd .day {
  border: 1px solid var(--border); border-radius: 5px; padding: 4px 2px; text-align: center;
  cursor: pointer; background: var(--surface);
}
.crowd .day .d { font-size: 10px; color: var(--ink-3); }
.crowd .day .n { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.crowd .day.ok   { }
.crowd .day.near { background: var(--warn-soft); border-color: var(--warn); }
.crowd .day.full { background: var(--warn-soft); border-color: var(--warn); }
.crowd .day.over { background: var(--bad-soft);  border-color: var(--bad); }
.crowd .day.sel  { outline: 2px solid var(--accent); outline-offset: 1px; }

.bar-row { display: grid; grid-template-columns: 62px 1fr 42px; gap: 8px; align-items: center; font-size: 12px; }
.bar { height: 12px; background: var(--raised); border-radius: 3px; overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar > u { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 2px dashed var(--bad); }

.msgbox {
  white-space: pre-wrap; font-size: 12.5px; background: var(--raised); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px; color: var(--ink-2); font-family: var(--sans);
}
pre.json {
  margin: 0; font-family: var(--mono); font-size: 11.5px; background: var(--raised);
  border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; color: var(--ink-2);
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-3); font-size: 12px; }
.stack { display: grid; gap: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 1000px) { .two { grid-template-columns: 1fr; } .app { grid-template-columns: 1fr; } .side { position: static; height: auto; } }

.toast {
  position: fixed; right: 18px; bottom: 18px; z-index: 100; display: grid; gap: 8px;
}
.toast > div {
  background: var(--surface); border: 1px solid var(--border-strong); border-left: 4px solid var(--accent);
  border-radius: 6px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 13px; max-width: 380px;
}
.toast > div.bad { border-left-color: var(--bad); }
.toast > div.ok  { border-left-color: var(--good); }

.overlay {
  position: fixed; inset: 0; background: rgba(10,12,15,.45); display: grid; place-items: center; z-index: 200;
}
.overlay .box {
  background: var(--surface); border-radius: 10px; padding: 26px 30px; min-width: 320px;
  box-shadow: var(--shadow); text-align: center;
}
.spin {
  width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; margin: 0 auto 12px; animation: sp 1s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.cand { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.cand.top { border-color: var(--accent); background: var(--accent-soft); }
.cand .head { display: flex; align-items: baseline; gap: 8px; }
.cand .score { font-family: var(--mono); font-size: 18px; font-weight: 700; }
.cand ul { margin: 0; padding-left: 18px; font-size: 12px; color: var(--ink-2); }
.cand ul.caution { color: var(--warn); }

/* ---- 本日の状況（スマホ連携）---- */
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.brand .variant {
  display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 700; padding: 1px 7px;
  border-radius: 4px; background: var(--warn-soft); color: var(--warn);
}
.today-grid { display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 22px; align-items: start; }
.phone-col { position: sticky; top: 72px; }
.phone {
  position: relative; width: 352px; height: 688px; margin: 0 auto; border-radius: 44px;
  border: 10px solid #16181c; background: #16181c; overflow: hidden;
  box-shadow: 0 18px 40px rgba(10,12,16,.28), 0 2px 6px rgba(10,12,16,.2);
}
.phone-notch {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 112px; height: 22px;
  background: #16181c; border-radius: 0 0 14px 14px; z-index: 6;
}
.phone-screen { height: 100%; border-radius: 32px; overflow: hidden; background: var(--ground); }
.phone-screen .mob-head { padding-top: 30px; }
@media (max-width: 1100px) { .today-grid { grid-template-columns: 1fr; } .phone-col { position: static; } }

.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1400px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.tile .lbl { font-size: 11.5px; color: var(--ink-3); }
.tile .val { font-size: 26px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 11px; color: var(--ink-3); min-height: 1.3em; }
.tile.good .val { color: var(--good); }
.tile.warn .val { color: var(--warn); }
.tile.bad { border-color: var(--bad); background: var(--bad-soft); }
.tile.bad .val { color: var(--bad); }
.sym {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px;
  color: #fff; font-size: 11px; font-weight: 800; vertical-align: middle;
}
tr.row-alert td { background: var(--bad-soft); }
.rep { border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 3px; }
.rep-w { white-space: pre-wrap; font-size: 13px; color: var(--ink-2); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* 従業員のスマホ画面。現場で片手・屋外・手袋ぎわで押すものなので、
   文字と押す場所は大きく、状態は色だけでなく文言と形でも示す。
   PC 側の電話枠にもそのまま入るよう、すべて .mob の中に閉じている。 */
.mob {
  --ground:  #F4F3F0; --surface: #FFFFFF; --raised: #FAF9F7;
  --border:  #E1DFD9; --border-strong: #C9C6BE;
  --ink: #1A1C20; --ink-2: #4A4E55; --ink-3: #767B83;
  --accent: #1B4A6B; --accent-ink: #FFFFFF; --accent-soft: #E7EEF4;
  --good: #1B6F5E; --good-soft: #E3F0EC;
  --warn: #9A5B00; --warn-soft: #FBEEDC;
  --bad: #A72316; --bad-soft: #FBE7E4;
  --sans: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .mob {
    --ground: #131519; --surface: #1B1E23; --raised: #22262C;
    --border: #31353C; --border-strong: #464C55;
    --ink: #E9E7E2; --ink-2: #B3B8C0; --ink-3: #838A94;
    --accent: #74A9CC; --accent-ink: #10151A; --accent-soft: #1F2E3A;
    --good: #63C3AC; --good-soft: #16302B;
    --warn: #DFA65A; --warn-soft: #33270F;
    --bad: #E88C80; --bad-soft: #38201C;
  }
}
:root[data-theme="dark"] .mob {
  --ground: #131519; --surface: #1B1E23; --raised: #22262C;
  --border: #31353C; --border-strong: #464C55;
  --ink: #E9E7E2; --ink-2: #B3B8C0; --ink-3: #838A94;
  --accent: #74A9CC; --accent-ink: #10151A; --accent-soft: #1F2E3A;
  --good: #63C3AC; --good-soft: #16302B;
  --warn: #DFA65A; --warn-soft: #33270F;
  --bad: #E88C80; --bad-soft: #38201C;
}
.mob {
  position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0;
  background: var(--ground); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
.mob *, .mob *::before, .mob *::after { box-sizing: border-box; }
.mob button, .mob input, .mob textarea { font: inherit; color: inherit; }
.mob button { cursor: pointer; }
.mob button:focus-visible, .mob input:focus-visible, .mob textarea:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}

.mob-head {
  flex: none; background: var(--accent); color: var(--accent-ink);
  padding: 14px 18px 12px; display: flex; align-items: center; gap: 10px;
}
.mob-head .who { font-weight: 700; font-size: 16px; line-height: 1.25; }
.mob-head .sub { font-size: 11.5px; opacity: .82; }
.mob-head .grow { flex: 1; min-width: 0; }
.mob-head .out {
  background: transparent; border: 1px solid rgba(255,255,255,.45); color: inherit;
  border-radius: 6px; font-size: 12px; padding: 4px 10px;
}
.mob-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 22px; }
.mob-body > * + * { margin-top: 12px; }
.mob-tabs {
  flex: none; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface); border-top: 1px solid var(--border);
}
.mob-tabs button {
  background: none; border: 0; padding: 11px 4px 12px; font-size: 12.5px; color: var(--ink-3);
  display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative;
}
.mob-tabs button .ic { font-size: 19px; line-height: 1; }
.mob-tabs button.on { color: var(--accent); font-weight: 700; }
.mob-tabs button.on::before {
  content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: 3px;
  background: var(--accent); border-radius: 0 0 3px 3px;
}
.mob-tabs .dot { position: absolute; top: 7px; right: calc(50% - 22px); width: 9px; height: 9px;
  border-radius: 50%; background: var(--bad); }

.mob .card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
}
.mob .card h3 { margin: 0 0 6px; font-size: 13px; color: var(--ink-3); font-weight: 600; letter-spacing: .04em; }
.mob .muted { color: var(--ink-3); font-size: 12.5px; }
.mob .row { display: flex; align-items: center; gap: 10px; }
.mob .grow { flex: 1; min-width: 0; }
.mob .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.mob .chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
  padding: 2px 9px; border-radius: 99px; background: var(--raised); color: var(--ink-2);
  border: 1px solid var(--border); white-space: nowrap;
}
.mob .chip.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.mob .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.mob .chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.mob .chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.mob .sym {
  flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
  font-weight: 800; font-size: 17px; color: #fff;
}

/* ログイン */
.mob .pick { display: flex; flex-direction: column; gap: 8px; }
.mob .pick button {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px;
}
.mob .pick button:active { background: var(--accent-soft); }
.mob .pick .nm { font-weight: 700; }
.mob .group-label { font-size: 12px; color: var(--ink-3); font-weight: 700; letter-spacing: .06em; margin: 6px 2px 0; }

/* 打刻 */
.mob .clockface { text-align: center; padding: 6px 0 2px; }
.mob .clockface .t { font-size: 46px; font-weight: 300; letter-spacing: .02em; line-height: 1.1; }
.mob .clockface .d { font-size: 13px; color: var(--ink-3); }
.mob .punch {
  width: 100%; border: 0; border-radius: 16px; padding: 22px 12px; color: #fff;
  font-size: 24px; font-weight: 800; letter-spacing: .08em;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  box-shadow: 0 6px 16px rgba(0,0,0,.14);
}
.mob .punch small { font-size: 12px; font-weight: 500; letter-spacing: .02em; opacity: .9; }
.mob .punch.in { background: var(--good); }
.mob .punch.out { background: var(--accent); }
.mob .punch:active { transform: translateY(1px); box-shadow: 0 2px 8px rgba(0,0,0,.14); }
.mob .punch[disabled] { opacity: .55; }
.mob .times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mob .times > div { background: var(--raised); border-radius: 10px; padding: 10px 12px; }
.mob .times .lbl { font-size: 11.5px; color: var(--ink-3); }
.mob .times .val { font-size: 24px; font-weight: 600; font-family: var(--mono); line-height: 1.2; }
.mob .times .val.none { color: var(--ink-3); font-weight: 400; }
.mob .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.mob .check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* 結果のシート */
.mob .sheet-wrap {
  position: absolute; inset: 0; background: rgba(10,12,16,.45); display: flex;
  align-items: flex-end; z-index: 5;
}
.mob .sheet {
  width: 100%; background: var(--surface); border-radius: 18px 18px 0 0; padding: 22px 20px 24px;
  text-align: center; animation: mob-up .22s ease-out;
}
@keyframes mob-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .mob .sheet { animation: none; } }
.mob .sheet .big { font-size: 19px; font-weight: 800; margin: 4px 0; }
.mob .sheet .tm { font-size: 44px; font-family: var(--mono); font-weight: 300; }
.mob .sheet .go { margin-top: 14px; }

/* フォーム */
.mob label.f { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
.mob .field { margin-top: 12px; }
.mob input[type=text], .mob input[type=number], .mob input:not([type]), .mob textarea {
  width: 100%; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 10px;
  padding: 10px 12px; font-size: 16px; /* 16px 未満だと iOS が入力時に拡大する */
}
.mob textarea { min-height: 92px; resize: vertical; }
.mob .mic {
  background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 99px;
  padding: 3px 11px; font-size: 12.5px; font-weight: 700;
}
.mob .mic.rec { background: var(--bad); color: #fff; }
.mob .seg { display: flex; gap: 6px; }
.mob .seg button {
  flex: 1; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 10px;
  padding: 9px 4px; font-size: 14px;
}
.mob .seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.mob .seg button.on.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.mob .btn {
  width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800;
  background: var(--accent); color: var(--accent-ink);
}
.mob .btn.ghost { background: var(--raised); color: var(--ink); border: 1px solid var(--border-strong); font-weight: 600; }
.mob .btn.sm { padding: 8px 10px; font-size: 13px; width: auto; font-weight: 600; }
.mob .banner { border-radius: 10px; padding: 9px 12px; font-size: 13px; }
.mob .banner.ok { background: var(--good-soft); color: var(--good); }
.mob .banner.warn { background: var(--warn-soft); color: var(--warn); }
.mob .banner.bad { background: var(--bad-soft); color: var(--bad); }
.mob .err { color: var(--bad); font-size: 13px; }

/* 予定 */
.mob .sched { padding: 0; overflow: hidden; }
.mob .sched .day { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--border); }
.mob .sched .day:first-child { border-top: 0; }
.mob .sched .day.today { background: var(--accent-soft); }
.mob .sched .day.off { color: var(--ink-3); }
.mob .sched .dt { width: 62px; font-weight: 700; }
.mob .sched .dt small { font-weight: 400; color: var(--ink-3); }
.mob .past-report { border-top: 1px solid var(--border); padding: 9px 0; font-size: 13px; }
.mob .past-report:first-of-type { border-top: 0; }
.mob .past-report .w { white-space: pre-wrap; color: var(--ink-2); }

/* デモ操作 */
.mob .demo {
  border: 1px dashed var(--border-strong); border-radius: 12px; padding: 10px 12px; background: transparent;
}
.mob .demo h3 { color: var(--warn); }
.mob .demo .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

/* /m を単体で開いたとき */
body.mob-page { margin: 0; background: var(--ground, #F4F3F0); }
body.mob-page .mob { height: 100dvh; max-width: 520px; margin: 0 auto; }
@media (min-width: 560px) { body.mob-page .mob { border-left: 1px solid var(--border); border-right: 1px solid var(--border); } }

/* 介護版：業務内容に足す定型句 */
.mob .quick { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
.mob .quick button {
  font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
}
.mob .quick button:active { background: var(--accent-soft); color: var(--accent); }
.mob .banner:not(.ok):not(.warn):not(.bad) { background: var(--accent-soft); color: var(--accent); }


.sharenote {
  background: var(--accent-soft); color: var(--accent); border-bottom: 1px solid var(--border);
  padding: 7px 22px; font-size: 12px; display: flex; gap: 10px; align-items: baseline;
}
.sharenote strong {
  background: var(--accent); color: var(--accent-ink); border-radius: 4px;
  padding: 1px 7px; font-size: 11px; letter-spacing: .06em;
}
.sharelede { font-size: 12.5px; color: var(--ink-2); line-height: 1.7;
             margin: 20px 0 4px; padding-top: 16px; border-top: 1px solid var(--border); }

      else if (k === 'style') e.setAttribute('style', v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      e.appendChild(typeof kid === 'object' ? kid : document.createTextNode(String(kid)));
    }
    return e;
  };
  const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
  const minOf = (hhmm) => (hhmm ? +hhmm.slice(0, 2) * 60 + +hhmm.slice(3, 5) : null);
  const durText = (m) => `${Math.floor(m / 60)}時間${String(m % 60).padStart(2, '0')}分`;

  function mount(container, host) {
    const KEY = 'sc_m_token';
    const S = {
      token: null, me: null, roster: null, tab: 'home', err: '', busy: false, sheet: null,
      form: null, formFor: null, geo: false, rec: null, demoOpen: false,
    };
    try { if (host.persist) S.token = localStorage.getItem(KEY); } catch (e) { /* 無くても動く */ }

    const call = (path, opts) => {
      const o = Object.assign({}, opts || {});
      o.headers = Object.assign({ 'Content-Type': 'application/json' }, o.headers || {});
      if (S.token) o.headers['X-Mobile-Token'] = S.token;
      return host.api(path, o);
    };
    const postJ = (p, b) => call(p, { method: 'POST', body: JSON.stringify(b || {}) });
    const changed = () => { if (host.onChange) host.onChange(); };

    async function loadMe() {
      try { S.me = await call('/api/m/me'); S.err = ''; }
      catch (e) {
        if (e.status === 401) { S.token = null; S.me = null; try { localStorage.removeItem(KEY); } catch (x) { /* */ } }
        else S.err = e.message;
      }
      if (!S.me) await loadRoster();
    }
    async function loadRoster() {
      try { S.roster = await call('/api/m/roster'); S.err = ''; } catch (e) { S.err = e.message; }
    }
    async function refresh(opts) {
      await loadMe();
      // 日報を書いている途中は描き直さない（入力が消えるため）
      if (opts && opts.quiet && S.tab === 'report' && S.me) return;
      render();
    }

    async function login(id) {
      S.busy = true; render();
      try {
        const r = await postJ('/api/m/login', { staffId: id });
        S.token = r.token;
        try { if (host.persist) localStorage.setItem(KEY, r.token); } catch (e) { /* */ }
        S.tab = 'home'; S.form = null; S.formFor = null;
        await loadMe();
      } catch (e) { S.err = e.message; }
      S.busy = false; render(); changed();
    }
    function logout() {
      S.token = null; S.me = null; S.tab = 'home'; S.form = null; S.formFor = null;
      try { localStorage.removeItem(KEY); } catch (e) { /* */ }
      loadRoster().then(render);
    }

    // ---- 打刻 ---------------------------------------------------------------
    function getPosition() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
          () => resolve(null), { timeout: 4000, maximumAge: 60000 });
      });
    }
    async function punch(kind) {
      if (S.busy) return;
      S.busy = true; S.err = ''; render();
      try {
        const pos = S.geo ? await getPosition() : null;
        const r = await postJ('/api/m/punch', Object.assign({ kind }, pos || {}));
        S.me = r.me;
        S.sheet = { kind, time: r.time, note: r.note, kot: r.kotStatus, geo: !!pos, geoAsked: S.geo };
      } catch (e) { S.err = e.message; await loadMe(); }
      S.busy = false; render(); changed();
    }

    // ---- 日報 ---------------------------------------------------------------
    function blankForm() {
      return { work: '', handover: '', hasHiyari: false, hiyari: '', condition: '良好' };
    }
    function ensureForm() {
      const t = S.me.today;
      const key = `${S.me.staff.id}|${t.dutyDate}|${t.report ? t.report.updatedAt : ''}`;
      if (S.form && S.formFor === key) return;
      const r = t.report;
      S.form = r ? { work: r.work || '', handover: r.handover || '', hasHiyari: !!r.hasHiyari,
        hiyari: r.hiyari || '', condition: r.condition || '良好' } : blankForm();
      S.formFor = key;
    }
    async function submitReport() {
      S.err = '';
      S.busy = true; render();
      try {
        const r = await postJ('/api/m/report', S.form);
        S.me = r.me; S.formFor = null;
        S.sheet = { kind: 'report', updated: r.updated };
      } catch (e) { S.err = e.message; }
      S.busy = false; render(); changed();
    }

    // 共有ページではマイク・位置情報が使えない（ページの外枠が許可しない）ので出さない
    const SR = host.noDeviceApis ? null : (window.SpeechRecognition || window.webkitSpeechRecognition);
    function toggleVoice(field, el) {
      if (S.rec) { S.rec.stop(); return; }
      const rec = new SR();
      rec.lang = 'ja-JP'; rec.interimResults = false; rec.continuous = false;
      rec.onresult = (ev) => {
        const text = Array.from(ev.results).map((x) => x[0].transcript).join('');
        S.form[field] = (S.form[field] ? S.form[field] + '\n' : '') + text;
        el.value = S.form[field];
      };
      rec.onerror = () => { S.err = 'この端末では音声入力を使えませんでした。キーボードのマイクを使ってください'; };
      rec.onend = () => { S.rec = null; render(); };
      S.rec = { rec, field };
      rec.start(); render();
    }

    // ---- 描画 ---------------------------------------------------------------
    const shiftRange = (sh) => sh.overnight
      ? `${sh.name} ${sh.date ? md(sh.date) + ' ' : ''}${sh.start}〜翌${sh.end}`
      : `${sh.name} ${sh.start}〜${sh.end}`;
    const symbol = (sh) => mh('div', { class: 'sym', style: `background:${sh.color}` }, sh.symbol);

    function viewLogin() {
      const r = S.roster;
      const body = [];
      body.push(mh('div', { class: 'card' },
        mh('div', { style: 'font-weight:700;font-size:17px' }, 'あなたの名前を選んでください'),
        mh('div', { class: 'muted', style: 'margin-top:4px' },
          'デモ用の簡易ログインです。本番は職員番号＋暗証番号、または LINE ログインにします。')));
      if (!r) { body.push(mh('div', { class: 'muted' }, '読み込み中…')); }
      else {
        const groups = [
          ['夜勤明け（昨夜からの勤務）', (x) => x.shift && x.shift.isPrevDay],
          ['本日の出勤予定', (x) => x.shift && !x.shift.isPrevDay],
          ['本日は休み・明け', (x) => !x.shift]];
        for (const [label, pred] of groups) {
          const list = r.staff.filter(pred);
          if (!list.length) continue;
          body.push(mh('div', { class: 'group-label' }, `${label}（${list.length}名）`));
          body.push(mh('div', { class: 'pick' }, list.map((s) => mh('button', { onclick: () => login(s.id) },
            s.shift ? symbol(s.shift) : mh('div', { class: 'sym', style: 'background:#8A8F98' }, (s.todayLabel || '休').slice(0, 1)),
            mh('div', { class: 'grow' }, mh('div', { class: 'nm' }, s.name),
              mh('div', { class: 'muted' }, s.shift ? shiftRange(s.shift) : (s.todayLabel || '休み'))),
            mh('span', { class: `chip ${s.state === '出勤中' ? 'ok' : s.state === '退勤済み' ? 'acc' : ''}` }, s.state)))));
        }
      }
      return [
        mh('div', { class: 'mob-head' }, mh('div', { class: 'grow' },
          mh('div', { class: 'who' }, 'ShiftCraft 出退勤・日報'),
          mh('div', { class: 'sub' }, r ? r.facility : ''))),
        mh('div', { class: 'mob-body' }, body, S.err ? mh('div', { class: 'err' }, S.err) : null),
      ];
    }

    function punchStatusChip(p, kind) {
      if (!p) return null;
      if (kind === 'in') {
        return p.lateMinutes ? mh('span', { class: 'chip warn' }, `遅刻 ${p.lateMinutes}分`)
          : mh('span', { class: 'chip ok' }, '定刻');
      }
      if (p.overtimeMinutes) return mh('span', { class: 'chip warn' }, `残業 ${p.overtimeMinutes}分`);
      if (p.earlyMinutes) return mh('span', { class: 'chip warn' }, `早退 ${p.earlyMinutes}分`);
      return mh('span', { class: 'chip ok' }, '定刻');
    }

    function viewHome() {
      const me = S.me, t = me.today, sh = t.shift, c = me.clock;
      const out = [];
      out.push(mh('div', { class: 'card clockface' },
        mh('div', { class: 't mono' }, c.hhmm),
        mh('div', { class: 'd' }, `${+t.date.slice(5, 7)}月${+t.date.slice(8, 10)}日（${t.weekday}）`
          + (c.mode === 'demo' ? '　デモ時計' : ''))));

      if (!sh) {
        const after = t.todayLabel === '明け';
        out.push(mh('div', { class: 'card' }, mh('div', { class: 'row' },
          mh('div', { class: 'sym', style: 'background:#8A8F98' }, after ? '明' : '休'),
          mh('div', {}, mh('div', { style: 'font-weight:700' }, after ? '本日は夜勤明けです' : '本日は休みの予定です'),
            mh('div', { class: 'muted' }, after ? '夜勤の退勤と日報は済んでいます。ゆっくり休んでください'
              : '出勤の予定がある日に打刻できます')))));
      } else {
        const prevDay = sh.isPrevDay;
        out.push(mh('div', { class: 'card' }, mh('div', { class: 'row' }, symbol(sh),
          mh('div', { class: 'grow' }, mh('div', { style: 'font-weight:700;font-size:16px' }, sh.name),
            mh('div', { class: 'muted mono' }, sh.overnight
              ? `${md(t.dutyDate)} ${sh.start}〜翌${sh.end}` : `${sh.start} 〜 ${sh.end}`)),
          mh('span', { class: 'chip acc' }, prevDay ? '昨夜からの勤務' : '本日の勤務'))));
        if (prevDay) {
          out.push(mh('div', { class: 'banner' },
            `夜勤明けです。打刻と日報は ${md(t.dutyDate)}（${t.dutyWeekday}）の夜勤として記録されます。`));
        }

        const pin = t.punchIn, pout = t.punchOut;
        out.push(mh('div', { class: 'times' },
          mh('div', {}, mh('div', { class: 'lbl' }, '出勤'),
            mh('div', { class: `val ${pin ? '' : 'none'}` }, pin ? pin.time : '--:--'),
            punchStatusChip(pin, 'in')),
          mh('div', {}, mh('div', { class: 'lbl' }, '退勤'),
            mh('div', { class: `val ${pout ? '' : 'none'}` }, pout ? pout.time : '--:--'),
            punchStatusChip(pout, 'out'))));

        if (!pin) {
          out.push(mh('button', { class: 'punch in', disabled: S.busy, onclick: () => punch('in') },
            '出勤', mh('small', {}, `${c.hhmm} に打刻します`)));
        } else if (!pout) {
          out.push(mh('button', { class: 'punch out', disabled: S.busy, onclick: () => punch('out') },
            '退勤', mh('small', {}, `${c.hhmm} に打刻します`)));
        } else {
          const worked = minOf(pout.time) - minOf(pin.time);
          out.push(mh('div', { class: 'banner ok' }, `本日の勤務は終了です。実働 ${durText(Math.max(worked, 0))}`));
        }
        if (!pout && !host.noDeviceApis) {
          out.push(mh('label', { class: 'check' },
            mh('input', { type: 'checkbox', checked: S.geo ? true : null, onchange: (e) => { S.geo = e.target.checked; } }),
            '打刻に位置情報を付ける（任意・既定はオフ）'));
        }
        const dest = me.variant === 'standalone' ? 'ShiftCraft の勤怠記録' : 'KING OF TIME';
        if (pin) {
          const ok = pin.kotStatus === 'ok' || pin.kotStatus === 'n/a';
          out.push(mh('div', { class: `banner ${ok ? 'ok' : 'warn'}` },
            ok ? (me.variant === 'standalone' ? `${dest}に記録済みです` : `${dest} へ送信済みです`)
              : `${dest} への送信に失敗しました。控えは残っています（管理者に連絡してください）`));
        }
      }

      if (!t.report && (sh || t.todayLabel !== '明け')) {
        out.push(mh('div', { class: 'card', style: 'display:flex;align-items:center;gap:10px' },
          mh('div', { class: 'grow' }, mh('div', { style: 'font-weight:700' },
            sh && sh.isPrevDay ? '夜勤の日報は未提出です' : '本日の日報は未提出です'),
            mh('div', { class: 'muted' }, '退勤前でも書けます。音声入力も使えます')),
          mh('button', { class: 'btn sm', onclick: () => { S.tab = 'report'; render(); } }, '日報を書く')));
      } else {
        if (t.report) out.push(mh('div', { class: 'banner ok' }, `日報は提出済みです（${t.report.updatedAt.slice(11, 16)}）`));
      }
      if (S.err) out.push(mh('div', { class: 'err' }, S.err));

      if (c.mode === 'demo') out.push(demoPanel());
      return out;
    }

    function demoPanel() {
      const set = async (body) => {
        try { await postJ('/api/demo/clock', body); } catch (e) { S.err = e.message; }
        await loadMe(); render(); changed();
      };
      const btn = (label, fn) => mh('button', { class: 'btn sm ghost', onclick: fn }, label);
      return mh('div', { class: 'demo' },
        mh('h3', {}, 'デモ操作（本番にはありません）'),
        mh('div', { class: 'muted' }, 'デモでは時計を進めて、遅刻・残業・退勤の場面を見せられます。本番では端末の実際の時刻で打刻されます。'),
        mh('div', { class: 'btns' },
          btn('+30分', () => set({ advance: 30 })), btn('+1時間', () => set({ advance: 60 })),
          btn('12:00', () => set({ clock: '12:00' })), btn('夕方 17:30', () => set({ clock: '17:30' })),
          btn('今日をやり直す', async () => {
            try { await postJ('/api/demo/reset-today'); } catch (e) { S.err = e.message; }
            S.form = null; S.formFor = null; await loadMe(); render(); changed();
          })));
    }

    function viewReport() {
      ensureForm();
      const me = S.me, t = me.today, f = S.form, prof = t.profile;
      const out = [];
      out.push(mh('div', { class: 'card' },
        mh('div', { class: 'row' },
          mh('div', { class: 'grow' }, mh('div', { style: 'font-weight:700;font-size:16px' },
            `${md(t.dutyDate)}（${t.dutyWeekday}）${t.shift && t.shift.isPrevDay ? 'の夜勤' : ''}の日報`),
            mh('div', { class: 'muted' }, t.shift ? `${t.shift.name}　${me.staff.name}` : me.staff.name)),
          t.report ? mh('span', { class: 'chip ok' }, '提出済み') : mh('span', { class: 'chip warn' }, '未提出')),
        t.report ? mh('div', { class: 'muted', style: 'margin-top:6px' }, '直して「再提出」すると、管理者の画面も更新されます') : null));

      const area = (field, label, ph, withMic) => {
        const ta = mh('textarea', { placeholder: ph, oninput: (e) => { f[field] = e.target.value; } });
        ta.value = f[field];
        const recOn = S.rec && S.rec.field === field;
        return mh('div', { class: 'field' },
          mh('div', { class: 'row', style: 'margin-bottom:4px' },
            mh('label', { class: 'f grow', style: 'margin:0' }, label),
            withMic && SR ? mh('button', { class: `mic ${recOn ? 'rec' : ''}`, type: 'button',
              onclick: () => toggleVoice(field, ta) }, recOn ? '● 話してください（タップで停止）' : '🎤 音声入力') : null),
          ta);
      };
      // タップで業務内容に足せる定型句（現場はスマホで長文を打たないため）
      const chips = (list) => mh('div', { class: 'quick' }, (list || []).map((w) => mh('button', {
        type: 'button', onclick: () => {
          const cur = f.work.trim();
          f.work = cur ? `${cur}\n・${w}` : `・${w}`;
          const ta = container.querySelector('textarea');
          if (ta) { ta.value = f.work; ta.focus(); }
        } }, '＋' + w)));
      const line = (field, label, ph, type) => {
        const inp = mh('input', { type: type || 'text', placeholder: ph, inputmode: type === 'number' ? 'numeric' : null,
          oninput: (e) => { f[field] = e.target.value; } });
        inp.value = f[field];
        return mh('div', { class: 'field' }, mh('label', { class: 'f' }, label), inp);
      };

      out.push(mh('div', { class: 'card' },
        area('work', '業務内容', prof.workHint, true),
        chips(prof.chips),
        area('handover', '申し送り', '次の勤務者に伝えたいこと（例：〇〇様 午後に微熱。看護師へ報告済み）', true),
        mh('div', { class: 'field' }, mh('label', { class: 'f' }, 'ヒヤリハット・事故'),
          mh('div', { class: 'seg' },
            mh('button', { type: 'button', class: f.hasHiyari ? '' : 'on', onclick: () => { f.hasHiyari = false; render(); } }, 'なし'),
            mh('button', { type: 'button', class: f.hasHiyari ? 'on bad' : '', onclick: () => { f.hasHiyari = true; render(); } }, 'あり'))),
        f.hasHiyari ? area('hiyari', 'ヒヤリハット・事故の内容', 'いつ・どこで・何があったか', true) : null,
        mh('div', { class: 'field' }, mh('label', { class: 'f' }, 'あなたの体調'),
          mh('div', { class: 'seg' }, ['良好', '普通', '不調'].map((v) => mh('button', {
            type: 'button', class: f.condition === v ? 'on' : '', onclick: () => { f.condition = v; render(); } }, v))))));

      out.push(mh('button', { class: 'btn', disabled: S.busy, onclick: submitReport }, t.report ? '再提出する' : '提出する'));
      if (S.err) out.push(mh('div', { class: 'err' }, S.err));
      if (!SR) out.push(mh('div', { class: 'muted' }, 'ヒント：キーボードのマイクボタンでも音声で入力できます。'));

      const past = me.reports.filter((r) => r.date !== t.dutyDate);
      if (past.length) {
        out.push(mh('div', { class: 'card' }, mh('h3', {}, '最近の日報'),
          past.map((r) => mh('div', { class: 'past-report' },
            mh('div', { class: 'row' }, mh('b', {}, `${md(r.date)}`),
              r.hasHiyari ? mh('span', { class: 'chip bad' }, 'ヒヤリあり') : null,
              mh('span', { class: 'muted' }, r.source === 'mobile' ? 'スマホ' : '')),
            mh('div', { class: 'w' }, r.work)))));
      }
      return out;
    }

    function viewSchedule() {
      const days = S.me.schedule;
      return [
        mh('div', { class: 'muted' }, '今日から2週間の予定です。勤務表で確定した内容が反映されます。'),
        mh('div', { class: 'card sched' }, days.map((d) => mh('div', {
          class: `day ${d.isToday ? 'today' : ''} ${d.isOff || !d.hasPlan ? 'off' : ''}` },
          mh('div', { class: 'dt' }, md(d.date), mh('small', {}, `（${d.weekday}）`)),
          d.shift ? [symbol(d.shift), mh('div', { class: 'grow' }, mh('div', { style: 'font-weight:700' }, d.shift.name),
            mh('div', { class: 'muted mono' }, `${d.shift.start}〜${d.shift.overnight ? '翌' : ''}${d.shift.end}`))]
            : mh('div', { class: 'grow' }, d.isAfter ? '明け' : d.hasPlan ? '休み' : '未作成'),
          d.isToday ? mh('span', { class: 'chip acc' }, '今日') : null))),
      ];
    }

    function viewSheet() {
      const s = S.sheet;
      const close = () => { S.sheet = null; render(); };
      if (s.kind === 'report') {
        return mh('div', { class: 'sheet-wrap', onclick: close }, mh('div', { class: 'sheet', onclick: (e) => e.stopPropagation() },
          mh('div', { style: 'font-size:40px' }, '✅'),
          mh('div', { class: 'big' }, s.updated ? '日報を再提出しました' : '日報を提出しました'),
          mh('div', { class: 'muted' }, '管理者の画面（本日の状況・日報）にすぐ反映されます'),
          mh('button', { class: 'btn go', onclick: close }, '閉じる')));
      }
      const warn = /遅刻|早退|残業/.test(s.note);
      const standalone = S.me.variant === 'standalone';
      const dest = s.kot === 'ok' ? 'KING OF TIME へ送信しました'
        : s.kot === 'n/a' ? 'ShiftCraft に記録しました'
          : 'KING OF TIME への送信に失敗（控えは保存済み）';
      void standalone;
      return mh('div', { class: 'sheet-wrap', onclick: close }, mh('div', { class: 'sheet', onclick: (e) => e.stopPropagation() },
        mh('div', { style: 'font-size:40px' }, s.kind === 'in' ? '🌅' : '🌙'),
        mh('div', { class: 'big' }, s.kind === 'in' ? '出勤を打刻しました' : '退勤を打刻しました。お疲れさまでした'),
        mh('div', { class: 'tm' }, s.time),
        mh('div', {}, mh('span', { class: `chip ${warn ? 'warn' : 'ok'}` }, s.note)),
        mh('div', { class: 'muted', style: 'margin-top:8px' }, dest + (s.geoAsked ? (s.geo ? '（位置情報あり）' : '（位置情報は取得できませんでした）') : '')),
        s.kind === 'out' && !S.me.today.report
          ? mh('button', { class: 'btn go', onclick: () => { S.sheet = null; S.tab = 'report'; render(); } }, '続けて日報を書く')
          : mh('button', { class: 'btn go', onclick: close }, '閉じる')));
    }

    function render() {
      const keepScroll = container.querySelector('.mob-body');
      const top = keepScroll ? keepScroll.scrollTop : 0;
      const root = mh('div', { class: 'mob' });
      if (!S.me) {
        viewLogin().forEach((n) => root.appendChild(n));
      } else {
        const me = S.me;
        root.appendChild(mh('div', { class: 'mob-head' },
          mh('div', { class: 'grow' }, mh('div', { class: 'who' }, me.staff.name),
            mh('div', { class: 'sub' }, `${me.facility}　職員番号 ${me.staff.employeeCode}`)),
          mh('button', { class: 'out', onclick: logout }, '切替')));
        const body = S.tab === 'report' ? viewReport() : S.tab === 'schedule' ? viewSchedule() : viewHome();
        root.appendChild(mh('div', { class: 'mob-body' }, body));
        const tab = (id, ic, label, dot) => mh('button', { class: S.tab === id ? 'on' : '',
          onclick: () => { S.tab = id; S.err = ''; render(); } }, mh('span', { class: 'ic' }, ic), label,
        dot ? mh('span', { class: 'dot' }) : null);
        root.appendChild(mh('div', { class: 'mob-tabs' },
          tab('home', '⏱', 'ホーム'), tab('report', '📝', '日報', !me.today.report && !!me.today.punchIn),
          tab('schedule', '📅', '予定')));
        if (S.sheet) root.appendChild(viewSheet());
      }
      container.textContent = '';
      container.appendChild(root);
      const nb = container.querySelector('.mob-body');
      if (nb && keepScroll) nb.scrollTop = top;
    }

    // 画面に戻ってきたとき・一定間隔で最新にする（管理者の画面で時計が動いた場合など）
    const tick = () => { if (!document.hidden && S.me) refresh({ quiet: true }); };
    document.addEventListener('visibilitychange', tick);

    render();
    (async () => { await loadMe(); render(); })();
    return { refresh: (o) => refresh(o), state: S, logout };
  }

  window.MobileApp = { mount };
})();

</script>
<script>
/* 共有ページ用のバックエンド。
   ローカル版ではサーバが持っていた処理を、そのままブラウザ内で動かす。
   移植したのは制約の検証・指標の算出・交渉候補のスコアリング・
   KING OF TIME の差分/送信/突合・マネーフォワード給与の給与試算・年末調整の
   書類回収状況。CP-SAT による求解だけは持ち込めないため、ローカルで実測した
   結果を再生する。 */
'use strict';

const LocalBackend = (() => {
  const S = JSON.parse(document.getElementById('snapshot').textContent);

  // ---- 可変の状態（訪問者の操作で変わる部分）----------------------------
  const db = {
    user: null,
    requests: S.requests.map((r) => ({ ...r })),
    plan: JSON.parse(JSON.stringify(S.plan)),
    negotiations: [],
    locked: new Map(),
    kotSchedules: [],          // 未送信の状態から始める
    kotRuns: [],
    mfAttendance: new Map(),   // 未連携の状態から始める（employeeKey → 集計）
    mfPayroll: new Map(),      // employeeKey → 給与試算
    mfRuns: [],
    nencho: S.nencho.map((n) => ({ ...n })),
    nextId: 100000,
    regenerated: false,
    // スマホ連携。初期値はローカルで実際に動かした朝の状態（snapshot）
    clock: { today: S.clock.today, hhmm: S.clock.hhmm },
    punches: [],               // 打刻と前日の日報は、いま画面にある勤務表から組み立てる（seedToday）
    nippo: [],
    sessions: new Map(),
  };
  const isKot = () => S.variant !== 'standalone';

  const USERS = {
    admin: { password: 'admin', id: 1, username: 'admin', displayName: '総務部長 久保田', role: 'admin', staffId: null },
    kawamoto: { password: 'kawamoto', id: 2, username: 'kawamoto', displayName: '河本 修一', role: 'staff', staffId: 2 },
    yokoji: { password: 'yokoji', id: 3, username: 'yokoji', displayName: '横路 智也', role: 'staff', staffId: 15 },
  };

  const staffById = (id) => S.staff.find((s) => s.id === id);
  const typeByCode = (code) => S.shiftTypes.find((t) => t.code === code);
  const dates = () => {
    const [y, m] = S.yearMonth.split('-').map(Number);
    const days = new Date(y, m, 0).getDate();
    const out = [];
    for (let d = 1; d <= days; d++) out.push(`${S.yearMonth}-${String(d).padStart(2, '0')}`);
    return out;
  };

  // H3 が数える資格と H4 が数える資格。サーバ側の qualificationGroups と同じ内容にする。
  const PRIMARY_Q = ['介護福祉士', '実務者研修', '社会福祉士'];
  const SECONDARY_Q = ['看護師', '准看護師'];
  const isQualified = (s) => s.qualifications.some((q) => PRIMARY_Q.includes(q) || SECONDARY_Q.includes(q));
  const isNurse = (s) => s.qualifications.some((q) => SECONDARY_Q.includes(q));

  const nightType = () => S.shiftTypes.find((t) => t.isNight);
  const afterType = () => S.shiftTypes.find((t) => t.isAfterNight);
  const offType = () => S.shiftTypes.find((t) => t.isHoliday);
  const dutyTypes = () => S.shiftTypes.filter((t) => t.isWorking && !t.isAfterNight);

  function gridOf(assignments) {
    const g = new Map();
    for (const a of assignments) g.set(a.staffId + '|' + a.date, a.code);
    return g;
  }

  // ---- 休める上限（capacity.py の移植）----------------------------------
  function capacityOfDay() {
    const requiredWorking = S.shiftTypes
      .filter((t) => t.isWorking && !t.isAfterNight)
      .reduce((n, t) => n + t.requiredStaff, 0);
    const requiredAfterNight = S.shiftTypes
      .filter((t) => t.isNight).reduce((n, t) => n + t.requiredStaff, 0);
    return {
      requiredWorking, requiredAfterNight,
      maxOff: Math.max(S.staff.length - requiredWorking - requiredAfterNight, 0),
    };
  }

  function crowdLevel(count, maxOff) {
    if (maxOff <= 0) return count > 0 ? 'over' : 'full';
    if (count > maxOff) return 'over';
    if (count === maxOff) return 'full';
    if (count >= maxOff - 1) return 'near';
    return 'ok';
  }

  function explainUnmet(date, count, cap) {
    return `${date} は${count}名が休みを希望していますが、勤務${cap.requiredWorking}名と`
      + `夜勤明け${cap.requiredAfterNight}名が必要なため、休めるのは最大${cap.maxOff}名です。`;
  }

  // ---- ハード制約の検証（optimizer.verify_solution の移植）---------------
  function verify(assignments) {
    const v = [];
    const g = gridOf(assignments);
    const ds = dates();
    // 夜勤・明けの区分を持たない業種では night/after が undefined になる。
    // .code を undefined のまま使うと g.get(...) === undefined が常に false になり、
    // H5/H6/H9 は自動的に無条件スキップされる（エンジン側の night_idx is None と同じ扱い）。
    const night = nightType(), after = afterType(), off = offType();
    const nightCode = night ? night.code : undefined;
    const afterCode = after ? after.code : undefined;
    const duty = new Set(dutyTypes().map((t) => t.code));
    const minHolidays = Math.max(1, Math.round(S.facility.minMonthlyHolidays * ds.length / 30));
    const L = S.facility.maxConsecutiveWorkDays;

    for (const date of ds) {
      for (const t of S.shiftTypes) {
        if (t.isHoliday || t.isAfterNight) continue;
        const assigned = S.staff.filter((s) => g.get(s.id + '|' + date) === t.code);
        if (assigned.length < t.requiredStaff) {
          v.push(`H2 ${date} ${t.name}: ${assigned.length}名 < 必要${t.requiredStaff}名`);
        }
        if (assigned.filter(isQualified).length < t.requiredQualified) {
          v.push(`H3 ${date} ${t.name}: 有資格者不足`);
        }
        if (assigned.filter(isNurse).length < t.requiredNurse) {
          v.push(`H4 ${date} ${t.name}: 看護職員不足`);
        }
      }
    }

    for (const s of S.staff) {
      const nights = nightCode ? ds.filter((d) => g.get(s.id + '|' + d) === nightCode) : [];
      if ((!s.canNightShift || s.isNewcomer) && nights.length) v.push(`H5 ${s.name}: 夜勤不可者に夜勤`);
      if (nightCode && nights.length > S.facility.maxMonthlyNightShifts) {
        v.push(`H9 ${s.name}: 夜勤${nights.length}回 > 上限${S.facility.maxMonthlyNightShifts}回`);
      }
      const offs = ds.filter((d) => g.get(s.id + '|' + d) === off.code);
      if (offs.length < minHolidays) v.push(`H8 ${s.name}: 休日${offs.length}日 < 下限${minHolidays}日`);

      const co = S.carryOver[String(s.id)] || {};
      if (nightCode && afterCode) {
        for (let i = 0; i < ds.length; i++) {
          const code = g.get(s.id + '|' + ds[i]);
          if (code === nightCode && i + 1 < ds.length && g.get(s.id + '|' + ds[i + 1]) !== afterCode) {
            v.push(`H6 ${s.name} ${ds[i]}: 夜勤の翌日が明けでない`);
          }
          if (code === afterCode) {
            if (i === 0) {
              if (co.lastShiftCode !== 'NIGHT') v.push(`H6 ${s.name} 初日の明けに前月夜勤の裏付けがない`);
            } else if (g.get(s.id + '|' + ds[i - 1]) !== nightCode) {
              v.push(`H6 ${s.name} ${ds[i]}: 明けの前日が夜勤でない`);
            }
            if (i + 1 < ds.length && g.get(s.id + '|' + ds[i + 1]) !== off.code) {
              v.push(`H6 ${s.name} ${ds[i]}: 明けの翌日が休でない`);
            }
          }
        }
      }

      let run = co.lastShiftCode === 'NIGHT' ? 0 : Math.min(co.consecutiveWorkDays || 0, L);
      for (const d of ds) {
        const code = g.get(s.id + '|' + d);
        if (code && duty.has(code)) {
          run += 1;
          if (run > L) v.push(`H7 ${s.name} ${d}: 連続勤務${run}日 > 上限${L}日`);
        } else run = 0;
      }
    }

    for (const r of db.requests) {
      if (r.priority !== 'required' || r.requestType !== 'off') continue;
      if (g.get(r.staffId + '|' + r.date) !== off.code) {
        v.push(`H10 ${r.staffName} ${r.date}: 絶対指定の希望休が未充足`);
      }
    }
    for (const [key, code] of db.locked) {
      if (g.get(key) !== code) v.push(`H11 固定セルが変更された: ${key.split('|')[1]}`);
    }
    return v;
  }

  // ---- 指標（compute_metrics の移植）------------------------------------
  function computeMetrics(assignments) {
    const g = gridOf(assignments);
    const ds = dates();
    const off = offType(), night = nightType();
    const nightCode = night ? night.code : undefined;
    const duty = new Set(dutyTypes().map((t) => t.code));

    let total = 0, fulfilled = 0;
    const unmet = [], byDate = {}, unmetByDate = {};
    for (const r of db.requests) {
      if (r.requestType !== 'off') continue;
      total += 1;
      byDate[r.date] = (byDate[r.date] || 0) + 1;
      if (g.get(r.staffId + '|' + r.date) === off.code) fulfilled += 1;
      else {
        const code = g.get(r.staffId + '|' + r.date);
        unmet.push({
          staffId: r.staffId, staffName: r.staffName, date: r.date, priority: r.priority,
          assigned: code ? typeByCode(code).name : '未割当',
        });
        (unmetByDate[r.date] = unmetByDate[r.date] || []).push(r.staffName);
      }
    }

    const nightCounts = {}, workHours = {}, holidayCounts = {};
    const eligible = [];
    for (const s of S.staff) {
      const nc = nightCode ? ds.filter((d) => g.get(s.id + '|' + d) === nightCode).length : 0;
      nightCounts[s.name] = nc;
      if (s.canNightShift && !s.isNewcomer) eligible.push(nc);
      let mins = 0;
      for (const d of ds) {
        const code = g.get(s.id + '|' + d);
        if (code) mins += typeByCode(code).workMinutes;
      }
      workHours[s.name] = Math.round(mins / 60 * 10) / 10;
      holidayCounts[s.name] = ds.filter((d) => g.get(s.id + '|' + d) === off.code).length;
    }

    let ngPair = 0;
    for (const rule of S.pairRules) {
      if (rule.ruleType !== 'avoid') continue;
      for (const d of ds) {
        const a = g.get(rule.staffAId + '|' + d), b = g.get(rule.staffBId + '|' + d);
        if (a && a === b && duty.has(a)) ngPair += 1;
      }
    }

    const newcomers = S.staff.filter((s) => s.isNewcomer);
    const veterans = S.staff.filter((s) => s.isVeteran);
    let supTotal = 0, supOk = 0;
    for (const d of ds) {
      for (const t of dutyTypes()) {
        const present = newcomers.filter((s) => g.get(s.id + '|' + d) === t.code);
        if (!present.length) continue;
        supTotal += 1;
        if (veterans.some((v) => g.get(v.id + '|' + d) === t.code)) supOk += 1;
      }
    }

    return {
      requestTotal: total, requestFulfilled: fulfilled,
      requestFulfillRate: total ? Math.round(fulfilled / total * 100) : 100,
      unmetRequests: unmet, unmetByDate, requestsByDate: byDate,
      offCapacity: capacityOfDay(), nightCounts,
      nightSpread: eligible.length ? Math.max(...eligible) - Math.min(...eligible) : 0,
      nightMin: eligible.length ? Math.min(...eligible) : 0,
      nightMax: eligible.length ? Math.max(...eligible) : 0,
      ngPairTogether: ngPair, newcomerSupportTotal: supTotal, newcomerSupportOk: supOk,
      newcomerSupportRate: supTotal ? Math.round(supOk / supTotal * 100) : 100,
      workHours, holidayCounts, assignmentCount: assignments.length,
    };
  }

  // ---- 交渉支援（negotiation.py の移植）---------------------------------
  function findAlternativeDates(staffId, originDate, limit = 3) {
    const g = gridOf(db.plan.assignments);
    const cap = capacityOfDay();
    const off = offType(), after = afterType();
    const afterCode = after ? after.code : undefined;
    const ds = dates();
    const requested = new Set(db.requests.filter((r) => r.staffId === staffId).map((r) => r.date));
    const originIdx = ds.indexOf(originDate);
    const out = [];
    ds.forEach((date, i) => {
      if (requested.has(date)) return;
      const own = g.get(staffId + '|' + date);
      if (own === off.code || (afterCode && own === afterCode)) return;
      const offCount = S.staff.filter((s) => g.get(s.id + '|' + date) === off.code).length;
      const slack = cap.maxOff - offCount;
      if (slack <= 0) return;
      out.push({ date, slack, distance: Math.abs(i - originIdx) });
    });
    out.sort((a, b) => a.distance - b.distance || b.slack - a.slack);
    return out.slice(0, limit);
  }

  function buildConflictDays() {
    const cap = capacityOfDay();
    const m = db.plan.metrics;
    return Object.keys(m.unmetByDate || {}).sort().map((date) => {
      const count = m.requestsByDate[date] || 0;
      return {
        date, requestCount: count, maxOff: cap.maxOff,
        requiredWorking: cap.requiredWorking, requiredAfterNight: cap.requiredAfterNight,
        unmetStaff: m.unmetByDate[date], structuralShortage: Math.max(count - cap.maxOff, 0),
        explanation: explainUnmet(date, count, cap),
      };
    });
  }

  function rankCandidates(date) {
    const g = gridOf(db.plan.assignments);
    const off = offType();
    const m = db.plan.metrics;
    const out = [];
    for (const r of db.requests) {
      if (r.date !== date || r.requestType !== 'off') continue;
      if (g.get(r.staffId + '|' + date) !== off.code) continue;
      const s = staffById(r.staffId);
      if (!s) continue;
      let score = 100;
      const reasons = [], cautions = [];

      if (r.priority === 'required') { score -= 70; cautions.push('「絶対」指定（通院・法事等の可能性）'); }
      else reasons.push('「できれば休み」指定');

      const u = S.unfulfilledHistory[String(s.id)] || 0;
      if (u === 0) { score += 25; reasons.push('直近6ヶ月で譲った実績なし'); }
      else if (u === 1) { score += 5; reasons.push('直近6ヶ月の未充足は1回'); }
      else { score -= 12 * u; cautions.push(`直近6ヶ月で${u}回譲っている`); }

      const alts = findAlternativeDates(s.id, date);
      if (alts.length) { score += 20; reasons.push(`代替日候補あり（${alts[0].date} ほか${alts.length - 1}件）`); }
      else { score -= 15; cautions.push('代替日の候補がない'); }

      const holidays = m.holidayCounts[s.name] || 0;
      if (holidays <= 7) { score -= 20; cautions.push(`その月の休みが${holidays}日と少ない`); }
      else if (holidays >= 10) { score += 8; reasons.push(`その月の休みは${holidays}日で余裕がある`); }

      const monthRequests = db.requests.filter((x) => x.staffId === s.id && x.requestType === 'off').length;
      if (monthRequests <= 1) { score += 20; reasons.push('その月の希望はこの1件のみ'); }
      else if (monthRequests === 2) { score += 10; reasons.push(`その月の希望は${monthRequests}件と少ない`); }
      else cautions.push(`その月に${monthRequests}件の希望を出している`);

      const nights = m.nightCounts[s.name] || 0;
      if (nights >= 5) { score -= 15; cautions.push(`その月の夜勤が${nights}回と多い`); }

      out.push({
        staffId: s.id, staffName: s.name, score, priority: r.priority, unfulfilledCount: u,
        holidayCount: holidays, nightCount: nights, monthRequestCount: monthRequests,
        alternatives: alts, reasons, cautions,
      });
    }
    out.sort((a, b) => b.score - a.score || a.unfulfilledCount - b.unfulfilledCount);
    return out;
  }

  function requestMessage(c, date, conflict) {
    const alt = c.alternatives.length ? c.alternatives[0].date : null;
    let body = `${c.staffName} さん\n\n${date} のお休みのご希望について相談させてください。\n`
      + `この日は${conflict.requestCount}名から希望が出ていますが、勤務${conflict.requiredWorking}名と`
      + `夜勤明け${conflict.requiredAfterNight}名が必要なため、休めるのは最大${conflict.maxOff}名です。\n`;
    body += alt
      ? `\n恐れ入りますが、代わりに ${alt} でお休みを取っていただくことは可能でしょうか。\n`
      : '\n恐れ入りますが、今回はご希望を取り下げていただくことは可能でしょうか。\n';
    return body + '\nご都合が悪い場合は遠慮なくお知らせください。';
  }

  // ---- KING OF TIME ------------------------------------------------------
  function kotRecords() {
    const f = S.facility;
    return db.plan.assignments
      .filter((a) => { const t = typeByCode(a.code); return t && !t.isHoliday && !t.isAfterNight; })
      .sort((a, b) => (a.date + a.staffId).localeCompare(b.date + b.staffId))
      .map((a) => {
        const t = typeByCode(a.code), s = staffById(a.staffId);
        return {
          companyCode: f.kotCompanyCode, employeeKey: s.employeeCode, date: a.date,
          scheduleCode: t.kotCode || t.code,
          startTime: t.startTime ? `${a.date}T${t.startTime}:00+09:00` : null,
          endTime: t.endTime ? `${a.date}T${t.endTime}:00+09:00` : null,
          workMinutes: t.workMinutes,
        };
      });
  }

  function kotDiff() {
    const records = kotRecords();
    const skipped = db.plan.assignments.length - records.length;
    const current = new Map(db.kotSchedules.map((r) => [r.employeeKey + '|' + r.date, r]));
    const New = [], changed = [], same = [];
    for (const r of records) {
      const cur = current.get(r.employeeKey + '|' + r.date);
      current.delete(r.employeeKey + '|' + r.date);
      if (!cur) New.push(r);
      else if (cur.scheduleCode !== r.scheduleCode || cur.startTime !== r.startTime) {
        changed.push({ ...r, before: cur.scheduleCode });
      } else same.push(r);
    }
    return { new: New, changed, same, removed: [...current.values()], skipped, total: records.length };
  }

  function kotSync() {
    const started = performance.now();
    const d = kotDiff();
    const targets = [...d.new, ...d.changed].map(({ before, ...r }) => r);
    const size = 100;
    const log = [];
    let created = 0, updated = 0;
    for (let i = 0; i < targets.length; i += size) {
      const batch = targets.slice(i, i + size);
      let c = 0, u = 0;
      for (const r of batch) {
        const key = r.employeeKey + '|' + r.date;
        const idx = db.kotSchedules.findIndex((x) => x.employeeKey + '|' + x.date === key);
        const row = { ...r, updatedAt: new Date().toISOString().slice(0, 19).replace('T', ' ') };
        if (idx >= 0) { db.kotSchedules[idx] = row; u += 1; } else { db.kotSchedules.push(row); c += 1; }
      }
      created += c; updated += u;
      // 所要時間はローカルで実際に送ったときの記録を使う（作り物の数字を出さない）
      const recorded = (S.kotRuns[0] && S.kotRuns[0].log[log.length]) || null;
      log.push({
        batch: log.length + 1, count: batch.length, status: 200,
        elapsedMs: recorded ? recorded.elapsedMs : 55,
        created: c, updated: u, failed: 0, errors: [],
      });
    }
    const result = {
      status: 'done', total: targets.length, created, updated, failed: 0,
      batches: log.length,
      elapsedMs: log.reduce((n, l) => n + l.elapsedMs, 0) || Math.round(performance.now() - started),
      log,
      diffSummary: { new: d.new.length, changed: d.changed.length, same: d.same.length,
        removed: d.removed.length, skipped: d.skipped },
    };
    db.kotRuns.unshift({
      id: db.kotRuns.length + 1, yearMonth: S.yearMonth, status: result.status,
      total: result.total, created, updated, failed: 0, batches: result.batches,
      elapsedMs: result.elapsedMs, log,
      createdAt: new Date().toISOString().slice(0, 19).replace('T', ' '),
    });
    return result;
  }

  const minutesOf = (iso) => (iso ? +iso.slice(11, 13) * 60 + +iso.slice(14, 16) : null);

  function kotReconcile() {
    const cards = attCards();
    const names = new Map(S.staff.map((s) => [s.employeeCode, s.name]));
    const rows = [];
    const today = db.clock.today, nowM = nowMin();
    for (const s of attSchedules()) {
      const c = cards.get(s.employeeKey + '|' + s.date);
      // これから来る日は対象外。当日は、出勤予定を過ぎても打刻が無い人だけを拾う。
      if (s.date > today) continue;
      if (s.date === today && (!c || !c.clockIn) && nowM <= minutesOf(s.startTime) + 10) continue;
      const item = {
        employeeKey: s.employeeKey, staffName: names.get(s.employeeKey) || s.employeeKey,
        date: s.date, scheduleCode: s.scheduleCode, planIn: s.startTime, planOut: s.endTime,
        actualIn: c ? c.clockIn : null, actualOut: c ? c.clockOut : null,
      };
      if (!c || !c.clockIn) { item.status = 'missing'; item.label = '打刻漏れ'; }
      else {
        const planIn = minutesOf(s.startTime);
        let planOut = minutesOf(s.endTime);
        const actIn = minutesOf(c.clockIn);
        let actOut = minutesOf(c.clockOut);
        if (planOut < planIn) { planOut += 1440; if (actOut !== null && actOut < planIn) actOut += 1440; }
        const late = actIn - planIn;
        let over = actOut !== null ? actOut - planOut : 0;
        if (s.date === today && actOut === null) over = 0;  // 当日の勤務中は残業を判定しない
        item.lateMinutes = late; item.overtimeMinutes = over;
        if (late > 5) { item.status = 'late'; item.label = `${late}分の遅刻`; }
        else if (over >= 30) { item.status = 'overtime'; item.label = `残業${over}分`; }
        else if (over < -5) { item.status = 'early'; item.label = `${-over}分の早退`; }
        else { item.status = 'ok'; item.label = '一致'; }
      }
      rows.push(item);
    }
    const counts = {};
    for (const r of rows) counts[r.status] = (counts[r.status] || 0) + 1;
    return {
      month: S.yearMonth, total: rows.length, counts,
      rows: rows.filter((r) => r.status !== 'ok').slice(0, 200), okCount: counts.ok || 0,
    };
  }

  // ---- CSV ---------------------------------------------------------------
  function rosterCsv() {
    const ds = dates();
    const g = gridOf(db.plan.assignments);
    const m = db.plan.metrics;
    const lines = [`${S.yearMonth} 勤務表,${S.facility.name}`];
    lines.push(['職員コード', '職員名', ...ds.map((d) => String(+d.slice(8))), '公休', '夜勤', '総労働時間'].join(','));
    for (const s of S.staff) {
      const row = [s.employeeCode, s.name];
      for (const d of ds) {
        const code = g.get(s.id + '|' + d);
        row.push(code ? typeByCode(code).symbol : '');
      }
      row.push(m.holidayCounts[s.name] ?? '', (m.nightCounts || {})[s.name] ?? '', m.workHours[s.name] ?? '');
      lines.push(row.join(','));
    }
    return lines.join('\r\n');
  }

  function detailCsv() {
    const lines = [['日付', '職員コード', '職員名', '勤務区分コード', '勤務区分名', '開始', '終了', '勤務分'].join(',')];
    const sorted = [...db.plan.assignments].sort((a, b) =>
      a.date.localeCompare(b.date) || a.staffId - b.staffId);
    for (const a of sorted) {
      const s = staffById(a.staffId), t = typeByCode(a.code);
      if (!s || !t) continue;
      lines.push([a.date, s.employeeCode, s.name, t.code, t.name,
        t.startTime || '', t.endTime || '', t.workMinutes].join(','));
    }
    return lines.join('\r\n');
  }

  // ---- マネーフォワード給与（mf_sync.py / mf_mock.py の移植）--------------
  const NENCHO_DOCS = [
    ['FUYO', '扶養控除等申告書'], ['HOKEN', '保険料控除申告書'],
    ['KISO', '基礎控除・配偶者控除等申告書'],
  ];
  const OT_RATE = 1.25;

  function minutesOfIso(iso) {
    return iso ? +iso.slice(11, 13) * 60 + +iso.slice(14, 16) : null;
  }

  function buildMfAttendance() {
    // KING OF TIME へすでに送った予定（db.kotSchedules）と、実際の打刻
    // （S.kotTimecards）から月次の勤怠集計を組み立てる。サーバ版と同じ計算。
    const cards = attCards();
    const agg = new Map();
    const today = db.clock.today;
    for (const sc of attSchedules()) {
      // 給与の基礎になるのは終わった勤務だけ（前日まで＋退勤まで済んだ当日）
      if (sc.date > today) continue;
      if (sc.date === today) { const c0 = cards.get(sc.employeeKey + '|' + sc.date); if (!c0 || !c0.clockOut) continue; }
      const a = agg.get(sc.employeeKey) || { workDays: 0, workMinutes: 0, overtimeMinutes: 0,
                                              lateCount: 0, absenceDays: 0 };
      agg.set(sc.employeeKey, a);
      const c = cards.get(sc.employeeKey + '|' + sc.date);
      if (!c || !c.clockIn) { a.absenceDays += 1; continue; }
      let planIn = minutesOfIso(sc.startTime), planOut = minutesOfIso(sc.endTime);
      let actIn = minutesOfIso(c.clockIn), actOut = minutesOfIso(c.clockOut);
      if (planIn !== null && planOut !== null && planOut < planIn) {
        planOut += 1440;
        if (actOut !== null && actOut < planIn) actOut += 1440;
      }
      const scheduled = (planIn !== null && planOut !== null) ? planOut - planIn : 0;
      const worked = (actIn !== null && actOut !== null) ? actOut - actIn : scheduled;
      a.workDays += 1;
      a.workMinutes += Math.max(worked, 0);
      a.overtimeMinutes += Math.max(worked - scheduled, 0);
      if (planIn !== null && actIn !== null && actIn - planIn > 5) a.lateCount += 1;
    }
    return agg;
  }

  function calcPayroll(staff, a) {
    const overtimeH = a.overtimeMinutes / 60;
    let basePay, overtimePay;
    if (staff.employmentType === '常勤') {
      basePay = staff.monthlyBaseSalary;
      const stdHours = (staff.monthlyContractMinutes || 9600) / 60;
      const hourlyEquiv = stdHours ? basePay / stdHours : 0;
      overtimePay = Math.round(hourlyEquiv * OT_RATE * overtimeH);
    } else {
      const workedH = a.workMinutes / 60;
      const regularH = Math.max(workedH - overtimeH, 0);
      basePay = Math.round(regularH * staff.hourlyWage);
      overtimePay = Math.round(overtimeH * OT_RATE * staff.hourlyWage);
    }
    return { basePay, overtimePay, grossPay: basePay + overtimePay };
  }

  function mfDiff() {
    const agg = buildMfAttendance();
    const newRecs = [], changed = [], same = [];
    for (const [key, a] of agg) {
      const cur = db.mfAttendance.get(key);
      if (!cur) newRecs.push(key);
      else if (cur.workMinutes !== a.workMinutes || cur.overtimeMinutes !== a.overtimeMinutes) changed.push(key);
      else same.push(key);
    }
    return { new: newRecs, changed, same, total: agg.size };
  }

  function mfSync() {
    const started = performance.now();
    const agg = buildMfAttendance();
    const staffByCode = new Map(S.staff.map((s) => [s.employeeCode, s]));
    const size = 100;
    const entries = [...agg.entries()];
    const log = [];
    let grossTotal = 0;
    for (let i = 0; i < entries.length; i += size) {
      const batch = entries.slice(i, i + size);
      let batchGross = 0;
      for (const [key, a] of batch) {
        db.mfAttendance.set(key, a);
        const staff = staffByCode.get(key);
        if (!staff) continue;
        const pay = calcPayroll(staff, a);
        db.mfPayroll.set(key, pay);
        batchGross += pay.grossPay;
      }
      grossTotal += batchGross;
      const recorded = (S.mfRuns[0] && S.mfRuns[0].log[log.length]) || null;
      log.push({
        batch: log.length + 1, count: batch.length, status: 200,
        elapsedMs: recorded ? recorded.elapsedMs : 30, grossTotal: batchGross,
      });
    }
    const result = {
      status: 'done', total: entries.length, failed: 0, grossTotal,
      batches: log.length,
      elapsedMs: log.reduce((n, l) => n + l.elapsedMs, 0) || Math.round(performance.now() - started),
      log, diffSummary: mfDiff(),
    };
    db.mfRuns.unshift({
      id: db.mfRuns.length + 1, yearMonth: S.yearMonth, status: result.status,
      total: result.total, grossTotal, batches: result.batches, elapsedMs: result.elapsedMs,
      log, createdAt: new Date().toISOString().slice(0, 19).replace('T', ' '),
    });
    return result;
  }

  function mfPayrollView() {
    const staffByCode = new Map(S.staff.map((s) => [s.employeeCode, s]));
    const records = [];
    let grossTotal = 0;
    for (const [key, pay] of db.mfPayroll) {
      const staff = staffByCode.get(key);
      const a = db.mfAttendance.get(key) || {};
      grossTotal += pay.grossPay;
      records.push({
        employeeKey: key, staffName: staff ? staff.name : key,
        employmentType: staff ? staff.employmentType : '',
        workDays: a.workDays || 0, workMinutes: a.workMinutes || 0,
        overtimeMinutes: a.overtimeMinutes || 0,
        basePay: pay.basePay, overtimePay: pay.overtimePay, grossPay: pay.grossPay,
      });
    }
    records.sort((a, b) => a.employeeKey.localeCompare(b.employeeKey));
    return { count: records.length, grossTotal, records };
  }

  // ---- 年末調整（nencho.py の移植）------------------------------------------
  function nenchoStatus() {
    const byKey = new Map();
    for (const d of db.nencho) {
      if (!byKey.has(d.employeeKey)) byKey.set(d.employeeKey, new Map());
      byKey.get(d.employeeKey).set(d.docCode, d);
    }
    const people = [];
    for (const s of S.staff) {
      const docs = byKey.get(s.employeeCode) || new Map();
      const items = NENCHO_DOCS.map(([code, label]) => {
        const d = docs.get(code);
        return { code, label, status: d ? d.status : 'not_submitted',
                submittedAt: d ? d.submittedAt : null, remindedAt: d ? d.remindedAt : null };
      });
      const done = items.filter((i) => i.status === 'submitted').length;
      people.push({
        staffId: s.id, staffName: s.name, employeeCode: s.employeeCode,
        employmentType: s.employmentType, submittedCount: done, totalCount: items.length,
        complete: done === items.length, documents: items,
      });
    }
    people.sort((a, b) => (a.complete === b.complete ? a.submittedCount - b.submittedCount : (a.complete ? 1 : -1)));
    const totalDocs = people.length * NENCHO_DOCS.length;
    const submittedDocs = people.reduce((n, p) => n + p.submittedCount, 0);
    return {
      year: S.nenchoYear, people, totalStaff: people.length,
      completeStaff: people.filter((p) => p.complete).length,
      totalDocs, submittedDocs, rate: totalDocs ? Math.round(submittedDocs / totalDocs * 100) : 100,
    };
  }

  function nenchoRemind(staffIds) {
    const st = nenchoStatus();
    const targets = st.people.filter((p) => !p.complete && (!staffIds || staffIds.includes(p.staffId)));
    const now = new Date().toISOString().slice(0, 19).replace('T', ' ');
    const reminded = [];
    for (const p of targets) {
      const missing = p.documents.filter((d) => d.status !== 'submitted').map((d) => d.code);
      for (const code of missing) {
        let row = db.nencho.find((d) => d.employeeKey === p.employeeCode && d.docCode === code);
        if (!row) { row = { employeeKey: p.employeeCode, docCode: code, status: 'not_submitted',
                            submittedAt: null, remindedAt: null }; db.nencho.push(row); }
        row.remindedAt = now;
      }
      reminded.push({ staffName: p.staffName, missing: missing.map((c) => NENCHO_DOCS.find((x) => x[0] === c)[1]) });
    }
    return { remindedAt: now, reminded, status: nenchoStatus() };
  }

  function nenchoMark(staffId, docCode) {
    const s = staffById(staffId);
    if (!s) return null;
    let row = db.nencho.find((d) => d.employeeKey === s.employeeCode && d.docCode === docCode);
    const now = new Date().toISOString().slice(0, 19).replace('T', ' ');
    if (!row) { row = { employeeKey: s.employeeCode, docCode, status: 'submitted',
                        submittedAt: now, remindedAt: null }; db.nencho.push(row); }
    else { row.status = 'submitted'; row.submittedAt = now; }
    return nenchoStatus();
  }

  // ---- 求解の再生 ---------------------------------------------------------
  const jobs = new Map();
  let jobSeq = 0;

  function startJob(label, steps, resultFn) {
    const id = `job-${++jobSeq}`;
    const started = performance.now();
    const job = { id, label, status: 'running', message: steps[0], elapsedMs: 0,
                  result: null, startedAt: started };
    jobs.set(id, job);
    steps.forEach((msg, i) => setTimeout(() => {
      if (job.status === 'running') job.message = msg;
    }, i * 300));
    setTimeout(() => {
      job.status = 'done';
      job.elapsedMs = Math.round(performance.now() - started);
      job.result = resultFn();
    }, steps.length * 300 + 200);
    return id;
  }


  // ---- スマホ連携（mobile.py / attendance.py / clock.py の移植）-------------
  // 夜勤（16:30〜翌09:30）は日をまたぐ。打刻と日報は「勤務の開始日」に付ける。
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  const PROFILES = {
    EARLY: { workHint: '起床・朝食・排泄の介助、バイタル測定など（例：起床介助 6名、朝食の全介助 2名）',
      chips: ['起床介助', '朝食介助', '排泄介助', '口腔ケア', 'バイタル測定', '服薬確認'] },
    DAY: { workHint: '入浴・昼食の介助、レクリエーション、記録など（例：入浴介助 4名、機能訓練の見守り）',
      chips: ['入浴介助', '昼食介助', '排泄介助', 'レクリエーション', '機能訓練', '記録'] },
    LATE: { workHint: '夕食・口腔ケア・就寝準備など（例：夕食介助 3名、就寝前の更衣）',
      chips: ['夕食介助', '口腔ケア', '排泄介助', '就寝準備', '服薬確認', '記録'] },
    NIGHT: { workHint: '巡視・排泄・体位変換・起床介助など（例：2時間ごとの巡視、体位変換 5名）',
      chips: ['定時巡視', '排泄介助', '体位変換', '起床介助', 'ナースコール対応', '記録'] },
  };
  const DEFAULT_PROFILE = { workHint: '本日の業務内容', chips: ['記録'] };
  const NIGHT_GRACE = 180, EARLY_PUNCH = 180;
  const httpErr = (status, message) => Object.assign(new Error(message), { status });

  const toMin = (t) => (t ? +t.slice(0, 2) * 60 + +t.slice(3, 5) : null);
  const nowMin = () => toMin(db.clock.hhmm);
  const clockState = () => ({ mode: 'demo', today: db.clock.today, hhmm: db.clock.hhmm });
  const hhmmOf = (iso) => (iso ? iso.slice(11, 16) : null);
  const addDays = (d, n) => {
    const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n);
    return t.toISOString().slice(0, 10);
  };
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
  const weekdayOf = (d) => WEEK[new Date(d + 'T00:00:00Z').getUTCDay()];
  const workShift = (code) => {
    const t = typeByCode(code);
    return t && !t.isHoliday && !t.isAfterNight && t.startTime ? t : null;
  };
  const codeOf = (staffId, date) => {
    const a = db.plan.assignments.find((x) => x.staffId === staffId && x.date === date);
    return a ? a.code : null;
  };
  const shiftOf = (staffId, date) => workShift(codeOf(staffId, date));
  const overnight = (t) => !!(t && t.startTime && t.endTime && t.endTime < t.startTime);
  const startRel = (t) => toMin(t.startTime);
  const endRel = (t) => toMin(t.endTime) + (overnight(t) ? 1440 : 0);
  const relOf = (iso, base) => (iso ? daysBetween(base, iso.slice(0, 10)) * 1440 + toMin(iso.slice(11, 16)) : null);
  const nowRel = (base) => daysBetween(base, db.clock.today) * 1440 + toMin(db.clock.hhmm);
  const isoAt = (base, rel) => {
    const d = addDays(base, Math.floor(rel / 1440)), m = ((rel % 1440) + 1440) % 1440;
    return `${d}T${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}:00+09:00`;
  };
  function dutyOf(staffId) {
    const today = db.clock.today, prev = addDays(today, -1);
    const psh = shiftOf(staffId, prev);
    if (overnight(psh) && nowRel(prev) <= endRel(psh) + NIGHT_GRACE) return [prev, psh];
