    return [today, shiftOf(staffId, today)];
  }
  const shiftView = (t, date) => (t ? Object.assign({ code: t.code, name: t.name, symbol: t.symbol,
    start: t.startTime, end: t.endTime, color: t.color, overnight: overnight(t) },
  date ? { date, isPrevDay: date < db.clock.today } : {}) : null);
  const punchOf = (staffId, date, kind) =>
    db.punches.find((p) => p.staffId === staffId && p.date === date && p.kind === kind);
  const reportOf = (staffId, date) => db.nippo.find((r) => r.staffId === staffId && r.date === date);
  const stamp = () => `${db.clock.today} ${db.clock.hhmm}:00`;

  function punchView(row, shift, base) {
    if (!row) return null;
    const v = { time: hhmmOf(row.punchedAt), date: row.punchedAt.slice(0, 10), source: row.source,
      kotStatus: row.kotStatus, hasLocation: row.lat != null };
    if (shift) {
      const t = relOf(row.punchedAt, base);
      if (row.kind === 'in') { const diff = t - startRel(shift); v.lateMinutes = diff > 5 ? diff : 0; }
      else {
        const diff = t - endRel(shift);
        v.overtimeMinutes = diff >= 30 ? diff : 0; v.earlyMinutes = diff < -5 ? -diff : 0;
      }
    }
    return v;
  }
  const reportView = (r) => (r ? {
    id: r.id, date: r.date, shiftCode: r.shiftCode, work: r.work, handover: r.handover,
    hasHiyari: !!r.hasHiyari, hiyari: r.hiyari, condition: r.condition, source: r.source,
    updatedAt: r.updatedAt } : null);

  function staffFromToken(ctx) {
    const sid = db.sessions.get((ctx.headers || {})['X-Mobile-Token'] || '');
    const st = sid && staffById(sid);
    if (!st) throw httpErr(401, 'ログインが必要です');
    return st;
  }

  function meView(staff) {
    const today = db.clock.today;
    const [date, sh] = dutyOf(staff.id);
    const schedule = [];
    for (let i = 0; i < 14; i++) {
      const d = addDays(today, i);
      const code = codeOf(staff.id, d);
      const t = code ? typeByCode(code) : null;
      schedule.push({ date: d, weekday: weekdayOf(d), isToday: d === today, isOff: !!(t && t.isHoliday),
        isAfter: !!(t && t.isAfterNight), hasPlan: !!t, shift: code ? shiftView(workShift(code)) : null });
    }
    const todayType = typeByCode(codeOf(staff.id, today));
    const recent = db.nippo.filter((r) => r.staffId === staff.id)
      .sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5).map(reportView);
    return {
      staff: { id: staff.id, name: staff.name, employeeCode: staff.employeeCode,
        qualifications: staff.qualifications },
      facility: S.facility.name, clock: clockState(), variant: S.variant || 'kot',
      today: {
        date: today, weekday: weekdayOf(today), todayLabel: todayType ? todayType.name : null,
        dutyDate: date, dutyWeekday: weekdayOf(date), shift: shiftView(sh, date),
        punchIn: punchView(punchOf(staff.id, date, 'in'), sh, date),
        punchOut: punchView(punchOf(staff.id, date, 'out'), sh, date),
        report: reportView(reportOf(staff.id, date)),
        profile: { ...(PROFILES[sh ? sh.code : ''] || DEFAULT_PROFILE) },
      },
      schedule, reports: recent,
    };
  }

  function roster() {
    const today = db.clock.today;
    const rows = S.staff.map((s) => {
      const [date, sh] = dutyOf(s.id);
      const state = !sh ? '休み' : punchOf(s.id, date, 'out') ? '退勤済み'
        : punchOf(s.id, date, 'in') ? '出勤中' : '未出勤';
      const t = typeByCode(codeOf(s.id, today));
      return { id: s.id, name: s.name, employeeCode: s.employeeCode,
        shift: shiftView(sh, date), state, todayLabel: t ? t.name : '未作成' };
    });
    const order = { 未出勤: 0, 出勤中: 1, 退勤済み: 2, 休み: 3 };
    rows.sort((a, b) => order[a.state] - order[b.state]
      || ((a.shift && a.shift.isPrevDay) ? 0 : 1) - ((b.shift && b.shift.isPrevDay) ? 0 : 1)
      || ((a.shift && a.shift.start) || '99').localeCompare((b.shift && b.shift.start) || '99') || a.id - b.id);
    return { clock: clockState(), variant: S.variant || 'kot', facility: S.facility.name, staff: rows };
  }

  function doPunch(ctx) {
    const staff = staffFromToken(ctx);
    const kind = ctx.body.kind;
    if (kind !== 'in' && kind !== 'out') throw httpErr(400, 'kind は in / out のいずれかです');
    const today = db.clock.today, now = db.clock.hhmm;
    const [date, sh] = dutyOf(staff.id);
    if (!sh) throw httpErr(400, '本日は休みの予定です。出勤の予定がある日に打刻してください');
    const have = punchOf(staff.id, date, kind);
    if (have) throw httpErr(409, `すでに${kind === 'in' ? '出勤' : '退勤'}を打刻しています（${hhmmOf(have.punchedAt)}）`);
    if (kind === 'out' && !punchOf(staff.id, date, 'in')) {
      throw httpErr(400, '出勤の打刻がありません。先に出勤を打刻してください');
    }
    const t = nowRel(date);
    if (kind === 'in' && t < startRel(sh) - EARLY_PUNCH) {
      throw httpErr(400, `出勤の打刻は始業（${sh.startTime}）の${EARLY_PUNCH / 60}時間前から受け付けます`);
    }
    const kotStatus = isKot() ? 'ok' : 'n/a';
    db.punches.push({ staffId: staff.id, date, kind, punchedAt: `${today}T${now}:00+09:00`,
      source: 'mobile', kotStatus, lat: ctx.body.lat ?? null, lng: ctx.body.lng ?? null, seq: db.nextId++ });
    let note;
    if (kind === 'in') {
      const diff = t - startRel(sh);
      note = diff > 5 ? `遅刻 ${diff}分` : diff >= -15 ? '定刻どおり' : `${-diff}分前に出勤`;
    } else {
      const diff = t - endRel(sh);
      note = diff >= 30 ? `残業 ${diff}分` : diff < -5 ? `早退 ${-diff}分` : '定刻どおり';
    }
    return { ok: true, kind, time: now, note, kotStatus, me: meView(staff) };
  }

  function doReport(ctx) {
    const staff = staffFromToken(ctx);
    const b = ctx.body;
    const [date, sh] = dutyOf(staff.id);
    const work = (b.work || '').trim();
    if (!work) throw httpErr(400, '業務内容を入力してください');
    const hasH = !!b.hasHiyari;
    const hiyari = hasH ? (b.hiyari || '').trim() : '';
    if (hasH && !hiyari) throw httpErr(400, 'ヒヤリハット・事故の内容を入力してください');
    const existing = reportOf(staff.id, date);
    const row = existing || { id: db.nextId++, staffId: staff.id, date };
    Object.assign(row, { shiftCode: sh ? sh.code : '', source: 'mobile', work,
      handover: (b.handover || '').trim(), hasHiyari: hasH, hiyari, condition: b.condition || '',
      updatedAt: stamp() });
    if (!existing) db.nippo.push(row);
    return { ok: true, updated: !!existing, me: meView(staff) };
  }

  function duties(date) {
    const prev = addDays(date, -1), out = [];
    for (const a of db.plan.assignments) {
      if (a.date !== prev) continue;
      const sh = workShift(a.code);
      if (overnight(sh) && staffById(a.staffId)) out.push([a.staffId, prev, sh]);
    }
    for (const a of db.plan.assignments) {
      if (a.date !== date) continue;
      const sh = workShift(a.code);
      if (sh && staffById(a.staffId)) out.push([a.staffId, date, sh]);
    }
    return out;
  }

  function board(date) {
    const today = db.clock.today;
    const rows = [];
    for (const [sid, d, sh] of duties(date)) {
      const s = staffById(sid);
      const pin = punchOf(sid, d, 'in'), pout = punchOf(sid, d, 'out');
      const start = startRel(sh), end = endRel(sh);
      const now = date === today ? nowRel(d) : 1e6;
      const late = pin ? relOf(pin.punchedAt, d) - start : 0;
      let status;
      if (pin && pout) status = 'done';
      else if (pin) status = now > end + 30 ? 'noout' : 'working';
      else if (date < today) status = 'absent';
      else if (now > start + 10) status = 'alert';
      else if (now > start - EARLY_PUNCH) status = 'pending';
      else status = 'planned';
      const over = pout ? relOf(pout.punchedAt, d) - end : 0;
      const prevNight = d < date;
      rows.push({
        staffId: sid, name: s.name, employeeCode: s.employeeCode, shiftDate: d, isPrevNight: prevNight,
        shiftCode: sh.code, shiftName: sh.name + (prevNight ? '（昨夜から）' : ''), symbol: sh.symbol,
        color: sh.color, start: sh.startTime, end: sh.endTime, status,
        clockIn: pin ? hhmmOf(pin.punchedAt) : null, clockOut: pout ? hhmmOf(pout.punchedAt) : null,
        lateMinutes: late > 5 ? late : 0, overtimeMinutes: over >= 30 ? over : 0,
        source: pout && pout.source === 'mobile' ? 'mobile' : pin ? pin.source : null,
        kotStatus: pin ? pin.kotStatus : '', report: reportView(reportOf(sid, d)),
      });
    }
    const order = { alert: 0, noout: 0, absent: 0, working: 1, pending: 2, planned: 3, done: 4 };
    rows.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9)
      || (a.isPrevNight ? 0 : 1) - (b.isPrevNight ? 0 : 1)
      || (a.start || '99').localeCompare(b.start || '99') || a.staffId - b.staffId);
    const count = (...st) => rows.filter((r) => st.includes(r.status)).length;
    const summary = {
      onDuty: rows.length, working: count('working', 'noout'), done: count('done'),
      pending: count('pending', 'planned'), alerts: count('alert', 'absent', 'noout'),
      late: rows.filter((r) => r.lateMinutes).length, prevNight: rows.filter((r) => r.isPrevNight).length,
      reports: rows.filter((r) => r.report).length,
      hiyari: rows.filter((r) => r.report && r.report.hasHiyari).length,
    };
    const out = { date, clock: clockState(), variant: S.variant || 'kot', summary, rows, kot: null };
    if (isKot()) {
      const recs = db.punches.filter((p) => p.punchedAt.slice(0, 10) === date).sort((a, b) => b.seq - a.seq)
        .map((p) => {
          const s = staffById(p.staffId);
          return { employeeKey: s.employeeCode, date: p.date, kind: p.kind, time: p.punchedAt,
            source: p.source === 'mobile' ? 'shiftcraft-mobile' : p.source, staffName: s.name };
        });
      out.kot = { ok: true, count: recs.length, records: recs.slice(0, 12), error: null };
    }
    return out;
  }

  function todayReports(date) {
    const prev = addDays(date, -1);
    const reports = db.nippo.filter((r) => r.date === date
      || (r.date === prev && overnight(typeByCode(r.shiftCode))))
      .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))
      .map((r) => ({ ...reportView(r), staffName: staffById(r.staffId).name,
        shiftName: (typeByCode(r.shiftCode) || {}).name || '' }));
    return { date, reports };
  }

  // 決まった乱数（同じ人・同じ日は何度作っても同じ）
  function hash32(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seedStr) {
    let a = hash32(seedStr);
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];

  // 朝の途中の状態（mobile.py の seed_today と同じ規則）。勤務表が変わるたびに作り直す。
  // 誰を未打刻・遅刻・押し忘れにするかは並び順で決める。スマホで実際に押された打刻は消さない。
  function seedToday(topup) {
    const today = db.clock.today, prev = addDays(today, -1);
    const near = (p) => p.date === today || p.date === prev;
    if (!topup) db.punches = db.punches.filter((p) => !(p.source === 'seed' && near(p)));
    const have = new Set(db.punches.filter(near).map((p) => `${p.staffId}|${p.date}|${p.kind}`));
    const mobileDone = new Set(db.punches.filter((p) => near(p) && p.source !== 'seed').map((p) => `${p.staffId}|${p.date}`));
    const dutyOn = (d) => db.plan.assignments.filter((a) => a.date === d)
      .map((a) => [a.staffId, workShift(a.code)]).filter(([id, sh]) => sh && staffById(id))
      .sort((a, b) => a[1].startTime.localeCompare(b[1].startTime) || a[0] - b[0]);
    const prevDuty = dutyOn(prev);
    const nights = prevDuty.filter(([, sh]) => overnight(sh)).map(([id]) => id);
    const stayId = nights.length ? nights[0] : null;   // 夜勤の先頭の1名（mobile.py と同じ）

    const duty = dutyOn(today);
    const ref = toMin(S.clock.hhmm);   // 役は朝の時点で決めて固定する（mobile.py の ROLE_CLOCK）
    const justStarted = duty.filter(([, sh]) => ref - 60 < startRel(sh) && startRel(sh) <= ref - 10);
    const alertId = justStarted.length ? justStarted[0][0] : null;
    const early = duty.filter(([id, sh]) => startRel(sh) <= ref - 20 && id !== alertId);
    const lateId = early.length > 2 ? early[Math.floor(early.length / 2)][0] : null;
    const groups = new Map();
    for (const [id, sh] of duty) {
      if (overnight(sh) || id === alertId || id === lateId) continue;
      if (!groups.has(sh.code)) groups.set(sh.code, []);
      groups.get(sh.code).push(id);
    }
    let main = [];
    for (const g of groups.values()) if (g.length > main.length) main = g;
    const forgetId = main.length ? Math.max(...main) : null;

    const add = (sid, d, kind, rel) => db.punches.push({ staffId: sid, date: d, kind,
      punchedAt: isoAt(d, rel), source: 'seed', kotStatus: isKot() ? 'ok' : 'n/a', lat: null, lng: null, seq: db.nextId++ });
    const put = (sid, d, sh, inOff, outOff, keepOpen) => {
      if (mobileDone.has(`${sid}|${d}`)) return;
      const n = nowRel(d), start = startRel(sh), end = endRel(sh);
      if (start + inOff > n) return;
      if (!have.has(`${sid}|${d}|in`)) add(sid, d, 'in', start + inOff);
      if (!keepOpen && end + outOff <= n && !have.has(`${sid}|${d}|out`)) add(sid, d, 'out', end + outOff);
    };
    for (const [sid, sh] of prevDuty) {
      const r = rng(`seed-prev|${prev}|${sid}`);
      put(sid, prev, sh, pick(r, [-12, -10, -8, -6, -5, -3]), pick(r, [0, 2, 4, 6, 9]), sid === stayId);
    }
    for (const [sid, sh] of duty) {
      if (sid === alertId) continue;
      const r = rng(`seed-today|${today}|${sid}`);
      const off = sid === lateId ? 9 + Math.floor(r() * 6) : pick(r, [-12, -10, -8, -6, -5, -4, -3, -2, 0, 1]);
      put(sid, today, sh, off, pick(r, [0, 1, 3, 5]), sid === forgetId);
    }
    if (!topup) seedReports(prevDuty);
  }

  // 前日の勤務の日報（mobile.py の _seed_reports と同じ規則）。9割ほどが提出済みで、
  // ヒヤリが1件混ざる。夜勤分は今朝の提出。夜勤の先頭の1名は、退勤も日報もこれから。
  const WORK_SAMPLES = {
    EARLY: ['・起床介助 6名、朝食の全介助 2名\n・バイタル測定、服薬確認', '・朝食介助、口腔ケア\n・排泄介助（定時）と居室の換気'],
    DAY: ['・入浴介助 4名\n・午後のレクリエーション担当、記録入力', '・昼食介助、機能訓練の見守り\n・A様の爪切り対応'],
    LATE: ['・夕食介助 3名、口腔ケア\n・就寝前の更衣と排泄介助', '・おやつ配膳、夕食の見守り\n・夜勤への引き継ぎ'],
    NIGHT: ['・2時間ごとの巡視、体位変換 5名\n・排泄介助、起床介助の準備', '・定時巡視、ナースコール対応 3回\n・朝の起床介助 4名'],
  };
  const HANDOVERS = ['・B様、夕方から微熱。看護師へ報告済み。夜間の検温をお願いします。',
    '・C様、義歯の不具合あり。歯科受診の調整を依頼中です。',
    '・D様のご家族から、週末の外出の連絡がありました。', '', ''];
  const HIYARI_TEXT = '・E様が浴室前でふらつき、職員が支えました。床の水滴が原因と思われます。';
  function seedReports(prevDuty) {
    const today = db.clock.today, prev = addDays(today, -1);
    db.nippo = db.nippo.filter((r) => !(r.source === 'seed' && (r.date === today || r.date === prev)));
    const r = rng(`seed-report|${prev}`);
    let stayTaken = false, hiyariGiven = false;
    for (const [sid, sh] of prevDuty) {
      if (r() < 0.1) continue;
      const night = overnight(sh);
      if (night && !stayTaken) { stayTaken = true; continue; }
      const hasH = !hiyariGiven && sh.code === 'DAY' && r() < 0.35;
      hiyariGiven = hiyariGiven || hasH;
      const minute = String(Math.floor(5 + r() * 50)).padStart(2, '0');
      const stampAt = night ? `${today} 09:${String(12 + Math.floor(r() * 21)).padStart(2, '0')}:00`
        : `${prev} ${sh.endTime.slice(0, 2) < '19' ? sh.endTime.slice(0, 2) : '19'}:${minute}:00`;
      if (db.nippo.some((x) => x.staffId === sid && x.date === prev)) continue;
      db.nippo.push({ id: db.nextId++, staffId: sid, date: prev, shiftCode: sh.code, source: 'seed',
        work: pick(r, WORK_SAMPLES[sh.code] || ['・通常業務']), handover: pick(r, HANDOVERS),
        hasHiyari: hasH, hiyari: hasH ? HIYARI_TEXT : '', condition: '良好', updatedAt: stampAt });
    }
  }

  function resetToday() {
    const today = db.clock.today, prev = addDays(today, -1);
    db.punches = db.punches.filter((p) => p.date !== today && p.date !== prev);
    db.nippo = db.nippo.filter((r) => !(r.date === today
      || (r.date === prev && overnight(typeByCode(r.shiftCode)))));
    db.clock.hhmm = S.clock.hhmm;
    seedToday();
  }

  // 終わった日の打刻（デモの過去分）。kot_mock._ensure_timecards / attendance.ensure_past_punches と
  // 同じ考え方で、予定に対して数分の遅れ・残業・打刻漏れを混ぜる。夜勤の退勤は翌朝。
  function synthCard(rec) {
    const r = rng(`${rec.employeeKey}|${rec.date}`);
    if (r() < 0.03 || !rec.startTime || !rec.endTime) return { clockIn: null, clockOut: null };
    const inShift = pick(r, [-8, -6, -5, -4, -4, -3, -3, -2, -2, -1, 0, 0, 1, 2, 9, 16]);
    const outShift = pick(r, [0, 0, 1, 2, 3, 4, 5, 8, 10, 14, 33, 41, -9]);
    const st = minutesOf(rec.startTime), en = minutesOf(rec.endTime);
    return { clockIn: isoAt(rec.date, st + inShift), clockOut: isoAt(rec.date, en + (en < st ? 1440 : 0) + outShift) };
  }

  // 突合が使う「予定」と「打刻実績」。サーバ側 attendance.py と同じ分担。
  function attSchedules() {
    if (isKot()) return db.kotSchedules;
    // KING OF TIME 用の区分コード（A01…）ではなく、自社の区分名で見せる（attendance.py と同じ）
    const own = new Map(S.shiftTypes.map((t) => [t.kotCode || t.code, t.name]));
    return kotRecords().map((r) => ({ ...r, scheduleCode: own.get(r.scheduleCode) || r.scheduleCode }));
  }
  function attCards() {
    const m = new Map();
    const prev = addDays(db.clock.today, -1);
    for (const rec of attSchedules()) {
      if (rec.date < prev) m.set(rec.employeeKey + '|' + rec.date, { employeeKey: rec.employeeKey, date: rec.date, ...synthCard(rec) });
    }
    for (const p of db.punches) {
      const s = staffById(p.staffId);
      if (!s) continue;
      const key = s.employeeCode + '|' + p.date;
      const c = m.get(key) || { employeeKey: s.employeeCode, date: p.date, clockIn: null, clockOut: null };
      if (p.kind === 'in') c.clockIn = p.punchedAt; else c.clockOut = p.punchedAt;
      m.set(key, c);
    }
    return m;
  }

  seedToday();

  // ---- ルータ -------------------------------------------------------------
  const routes = [
    ['POST', /^\/api\/login$/, (ctx) => {
      const u = USERS[(ctx.body.username || '').trim()];
      if (!u || u.password !== ctx.body.password) {
        throw Object.assign(new Error('ID またはパスワードが違います'), { status: 401 });
      }
      db.user = u;
      return { user: publicUser(u) };
    }],
    ['POST', /^\/api\/logout$/, () => { db.user = null; return { ok: true }; }],

    // ---- スマホ連携 -------------------------------------------------------
    ['GET', /^\/api\/m\/roster$/, () => roster()],
    ['POST', /^\/api\/m\/login$/, (ctx) => {
      const sid = Number(ctx.body.staffId || 0);
      if (!staffById(sid)) throw httpErr(404, '職員が見つかりません');
      const token = 'm' + (db.nextId++) + Math.random().toString(36).slice(2);
      db.sessions.set(token, sid);
      return { token };
    }],
    ['GET', /^\/api\/m\/me$/, (ctx) => meView(staffFromToken(ctx))],
    ['POST', /^\/api\/m\/punch$/, (ctx) => doPunch(ctx)],
    ['POST', /^\/api\/m\/report$/, (ctx) => doReport(ctx)],
    ['GET', /^\/api\/clock$/, () => ({ clock: clockState() })],
    ['POST', /^\/api\/demo\/clock$/, (ctx) => {
      if (!(db.user && db.user.role === 'admin')) staffFromToken(ctx);
      const b = ctx.body;
      if (b.today) db.clock.today = b.today;
      if (b.clock) db.clock.hhmm = b.clock;
      if (b.advance) {
        const t = Math.max(0, Math.min(23 * 60 + 59, toMin(db.clock.hhmm) + Number(b.advance)));
        db.clock.hhmm = `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
      }
      seedToday(true);
      return { clock: clockState() };
    }],
    ['POST', /^\/api\/demo\/reset-today$/, (ctx) => {
      if (!(db.user && db.user.role === 'admin')) staffFromToken(ctx);
      resetToday();
      return { clock: clockState() };
    }],
    ['GET', /^\/api\/today\/board$/, (ctx) => { requireAdmin(); return board(ctx.query.date || db.clock.today); }],
    ['GET', /^\/api\/today\/reports$/, (ctx) => { requireAdmin(); return todayReports(ctx.query.date || db.clock.today); }],
    ['GET', /^\/api\/attendance\/reconcile$/, () => { requireAdmin(); return kotReconcile(); }],
    ['GET', /^\/api\/me$/, () => ({ user: db.user ? publicUser(db.user) : null })],

    ['GET', /^\/api\/bootstrap$/, () => {
      requireLogin();
      const cap = capacityOfDay();
      const counts = {};
      for (const r of db.requests) if (r.requestType === 'off') counts[r.date] = (counts[r.date] || 0) + 1;
      return {
        user: publicUser(db.user), yearMonth: S.yearMonth, facility: S.facility,
        shiftTypes: S.shiftTypes, staff: S.staff, pairRules: S.pairRules,
        requests: db.requests, plan: db.plan, negotiations: db.negotiations,
        demoToday: S.demoToday, months: [S.yearMonth],
        variant: S.variant || 'kot', clock: clockState(), mobileUrls: null,
        crowd: {
          capacity: cap,
          days: dates().map((d) => ({
            date: d, requestCount: counts[d] || 0, maxOff: cap.maxOff,
            level: crowdLevel(counts[d] || 0, cap.maxOff),
          })),
        },
      };
    }],

    ['POST', /^\/api\/requests$/, (ctx) => {
      requireLogin();
      const staffId = Number(ctx.body.staffId);
      if (db.user.role !== 'admin' && db.user.staffId !== staffId) {
        throw Object.assign(new Error('自分の希望のみ登録できます'), { status: 403 });
      }
      const s = staffById(staffId);
      const found = db.requests.find((r) => r.staffId === staffId && r.date === ctx.body.date
        && r.requestType === (ctx.body.requestType || 'off'));
      if (found) found.priority = ctx.body.priority || 'preferred';
      else {
        db.requests.push({
          id: db.nextId++, staffId, staffName: s.name, date: ctx.body.date,
          requestType: ctx.body.requestType || 'off', priority: ctx.body.priority || 'preferred',
          shiftTypeId: null, note: '',
        });
      }
      db.plan.metrics = computeMetrics(db.plan.assignments);
      return { requests: db.requests };
    }],

    ['DELETE', /^\/api\/requests\/(\d+)$/, (ctx, m) => {
      requireLogin();
      const id = +m[1];
      const idx = db.requests.findIndex((r) => r.id === id);
      if (idx < 0) throw Object.assign(new Error('見つかりません'), { status: 404 });
      if (db.user.role !== 'admin' && db.user.staffId !== db.requests[idx].staffId) {
        throw Object.assign(new Error('自分の希望のみ取消できます'), { status: 403 });
      }
      db.requests.splice(idx, 1);
      db.plan.metrics = computeMetrics(db.plan.assignments);
      return { requests: db.requests };
    }],

    ['POST', /^\/api\/generate$/, () => {
      requireAdmin();
      return {
        jobId: startJob('勤務表を生成', [
          '入力を組み立てています', `求解中（${S.staff.length}名 × ${dates().length}日）`,
          'ハード制約を再チェックしています',
        ], () => {
          db.plan = JSON.parse(JSON.stringify(S.plan));
          db.locked.clear();
          db.regenerated = false;
          seedToday();
          return { ...db.plan, status: 'OPTIMAL', replayed: true, planId: db.plan.id };
        }),
      };
    }],

    ['GET', /^\/api\/jobs\/([\w-]+)$/, (ctx, m) => {
      const job = jobs.get(m[1]);
      if (!job) throw Object.assign(new Error('ジョブが見つかりません'), { status: 404 });
      const elapsed = job.status === 'running'
        ? Math.round(performance.now() - job.startedAt) : job.elapsedMs;
      return { ...job, elapsedMs: elapsed };
    }],

    ['POST', /^\/api\/plans\/(\d+)\/edit$/, (ctx) => {
      requireAdmin();
      const { staffId, date, code } = ctx.body;
      const t = typeByCode(code);
      if (!t) throw Object.assign(new Error('勤務区分が不正です'), { status: 400 });
      db.plan.assignments = db.plan.assignments
        .filter((a) => !(a.staffId === staffId && a.date === date))
        .concat([{ staffId, date, shiftTypeId: t.id, code }]);
      db.locked.set(staffId + '|' + date, code);
      const violations = verify(db.plan.assignments);
      db.plan.violationDetails = violations;
      db.plan.hardViolations = violations.length;
      db.plan.metrics = computeMetrics(db.plan.assignments);
      db.plan.editedCount += 1;
      return {
        plan: db.plan,
        check: { hardViolations: violations.length, violationDetails: violations, metrics: db.plan.metrics },
      };
    }],

    ['POST', /^\/api\/plans\/(\d+)\/confirm$/, () => {
      requireAdmin();
      if (db.plan.hardViolations > 0) {
        throw Object.assign(new Error(`ハード制約違反が${db.plan.hardViolations}件あるため確定できません`), { status: 400 });
      }
      db.plan.status = 'confirmed';
      return { plan: db.plan };
    }],

    ['GET', /^\/api\/plans\/(\d+)\/negotiation$/, (ctx) => {
      requireAdmin();
      const date = ctx.query.date;
      const conflicts = buildConflictDays();
      const cap = capacityOfDay();
      const conflict = conflicts.find((c) => c.date === date) || {
        date, requestCount: db.plan.metrics.requestsByDate[date] || 0, maxOff: cap.maxOff,
        requiredWorking: cap.requiredWorking, requiredAfterNight: cap.requiredAfterNight,
        unmetStaff: [], structuralShortage: 0,
        explanation: explainUnmet(date, db.plan.metrics.requestsByDate[date] || 0, cap),
      };
      const candidates = rankCandidates(date).map((c) => ({ ...c, message: requestMessage(c, date, conflict) }));
      return { conflict, candidates };
    }],

    ['POST', /^\/api\/negotiations$/, (ctx) => {
      requireAdmin();
      const b = ctx.body;
      const s = staffById(b.staffId);
      db.negotiations.unshift({
        id: db.nextId++, staffId: b.staffId, staffName: s.name, date: b.date,
        kind: b.kind || 'reschedule', altDate: b.altDate || null, score: b.score || 0,
        message: b.message || '', status: 'pending', reply: '', applied: false,
      });
      return { id: db.negotiations[0].id };
    }],

    ['POST', /^\/api\/negotiations\/(\d+)\/respond$/, (ctx, m) => {
      requireLogin();
      const n = db.negotiations.find((x) => x.id === +m[1]);
      if (!n) throw Object.assign(new Error('見つかりません'), { status: 404 });
      if (db.user.role !== 'admin' && db.user.staffId !== n.staffId) {
        throw Object.assign(new Error('自分あての依頼のみ返答できます'), { status: 403 });
      }
      n.status = ctx.body.status;
      n.reply = ctx.body.reply || '';
      return { ok: true };
    }],

    ['POST', /^\/api\/plans\/(\d+)\/regenerate$/, () => {
      requireAdmin();
      const accepted = db.negotiations.filter((n) => n.status === 'accepted' && !n.applied);
      // 実際に記録されている（承諾済みの）交渉と同じ職員・同じ日であれば、
      // ローカルで実測した「再生成後」の計画をそのまま再生する。
      const recorded = S.negotiations[0];
      const target = recorded && accepted.find((n) => n.staffId === recorded.staffId && n.date === recorded.date);
      for (const n of accepted) {
        const r = db.requests.find((x) => x.staffId === n.staffId && x.date === n.date && x.requestType === 'off');
        if (r) { if (n.kind === 'reschedule' && n.altDate) r.date = n.altDate; else db.requests.splice(db.requests.indexOf(r), 1); }
        n.applied = true;
      }
      return {
        appliedCount: accepted.length,
        jobId: startJob('再生成', ['承諾を希望休へ反映しています', '前回計画をヒントに再生成中', 'ハード制約を再チェックしています'],
          () => {
            if (target) {
              db.plan = JSON.parse(JSON.stringify(S.planAfterNegotiation));
              db.regenerated = true;
              db.locked.clear();
              seedToday();
            } else {
              db.plan.metrics = computeMetrics(db.plan.assignments);
            }
            return { ...db.plan, replayed: !!target, unmatched: !target };
          }),
      };
    }],

    ['GET', /^\/api\/integrations$/, () => {
      requireAdmin();
      return {
        config: {
          'kot.base_url': 'https://api.kingtime.jp/v1.0（共有版はブラウザ内のモック）',
          'kot.company_code': S.facility.kotCompanyCode,
          'kot.batch_size': '100',
          'kot.token': '••••••••oken',
          'mf.base_url': 'https://api.biz.moneyforward.com/api/v2（共有版はブラウザ内のモック）',
          'mf.office_code': 'SAKURA-HR01',
          'mf.batch_size': '100',
          'mf.token': '••••••••oken',
        },
      };
    }],
    ['PUT', /^\/api\/integrations$/, () => ({ ok: true })],

    ['GET', /^\/api\/kot\/ping$/, () => {
      requireAdmin();
      return {
        ok: true, status: 200, elapsedMs: 4, url: 'https://api.kingtime.jp/v1.0',
        body: { companyCode: S.facility.kotCompanyCode, companyName: S.facility.name,
                apiVersion: '1.0', status: 'active' },
      };
    }],

    ['GET', /^\/api\/plans\/(\d+)\/kot\/diff$/, () => {
      requireAdmin();
      const d = kotDiff();
      return {
        summary: { new: d.new.length, changed: d.changed.length, same: d.same.length,
          removed: d.removed.length, skipped: d.skipped, total: d.total },
        sampleNew: d.new.slice(0, 5), sampleChanged: d.changed.slice(0, 5),
      };
    }],

    ['POST', /^\/api\/plans\/(\d+)\/kot\/sync$/, () => {
      requireAdmin();
      if (db.plan.status !== 'confirmed') {
        throw Object.assign(new Error('確定した勤務表のみ送信できます'), { status: 400 });
      }
      return {
        jobId: startJob('KING OF TIME へ送信',
          ['KING OF TIME 側の現在値を取得しています', '送信中 1/3 バッチ', '送信中 2/3 バッチ', '送信中 3/3 バッチ'],
          () => kotSync()),
      };
    }],

    ['GET', /^\/api\/kot\/schedules$/, () => {
      requireAdmin();
      const names = new Map(S.staff.map((s) => [s.employeeCode, s.name]));
      return {
        companyCode: S.facility.kotCompanyCode, month: S.yearMonth, count: db.kotSchedules.length,
        records: db.kotSchedules.map((r) => ({ ...r, staffName: names.get(r.employeeKey) || r.employeeKey })),
      };
    }],

    ['GET', /^\/api\/kot\/reconcile$/, () => { requireAdmin(); return kotReconcile(); }],
    ['GET', /^\/api\/kot\/runs$/, () => { requireAdmin(); return { runs: db.kotRuns }; }],
    ['GET', /^\/api\/plans\/(\d+)\/exports$/, () => ({ history: [] })],
    ['GET', /^\/api\/csv$/, (ctx) => ({
      text: ctx.query.kind === 'detail' ? detailCsv() : rosterCsv(),
    })],

    // ---- マネーフォワード給与・年末調整 -----------------------------------
    ['GET', /^\/api\/mf\/ping$/, () => {
      requireAdmin();
      return {
        ok: true, status: 200, elapsedMs: 1, url: 'https://api.biz.moneyforward.com/api/v2',
        body: { officeCode: 'SAKURA-HR01', officeName: S.facility.name, apiVersion: '2.0', status: 'active' },
      };
    }],

    ['GET', /^\/api\/mf\/diff$/, () => {
      requireAdmin();
      const d = mfDiff();
      return { summary: { new: d.new.length, changed: d.changed.length, same: d.same.length, total: d.total } };
    }],

    ['POST', /^\/api\/plans\/(\d+)\/mf\/sync$/, () => {
      requireAdmin();
      if (db.plan.status !== 'confirmed') {
        throw Object.assign(new Error('確定した勤務表のみ給与試算に反映できます'), { status: 400 });
      }
      return {
        jobId: startJob('マネーフォワード給与へ連携',
          ['KING OF TIME の勤怠実績を集計しています', '送信中 1/1 バッチ'],
          () => mfSync()),
      };
    }],

    ['GET', /^\/api\/mf\/payroll$/, () => { requireAdmin(); return mfPayrollView(); }],
    ['GET', /^\/api\/mf\/runs$/, () => { requireAdmin(); return { runs: db.mfRuns }; }],

    ['GET', /^\/api\/nencho\/status$/, (ctx) => {
      requireLogin();
      const st = nenchoStatus();
      if (db.user.role !== 'admin') {
        const sid = db.user.staffId;
        st.people = st.people.filter((p) => p.staffId === sid);
      }
      return st;
    }],

    ['POST', /^\/api\/nencho\/remind$/, (ctx) => {
      requireAdmin();
      return nenchoRemind(ctx.body.staffIds);
    }],

    ['POST', /^\/api\/nencho\/mark$/, (ctx) => {
      requireAdmin();
      const st = nenchoMark(Number(ctx.body.staffId), ctx.body.docCode);
      if (!st) throw Object.assign(new Error('職員が見つかりません'), { status: 404 });
      return st;
    }],
  ];

  function publicUser(u) {
    return { id: u.id, username: u.username, displayName: u.displayName, role: u.role, staffId: u.staffId };
  }
  function requireLogin() {
    if (!db.user) throw Object.assign(new Error('ログインが必要です'), { status: 401 });
  }
  function requireAdmin() {
    requireLogin();
    if (db.user.role !== 'admin') throw Object.assign(new Error('管理者のみ操作できます'), { status: 403 });
  }

  async function handle(path, options) {
    const [rawPath, qs] = path.split('?');
    const query = Object.fromEntries(new URLSearchParams(qs || ''));
    const method = (options && options.method) || 'GET';
    const body = options && options.body ? JSON.parse(options.body) : {};
    if (!isKot() && /^\/api\/(kot\/|plans\/\d+\/kot\/)/.test(rawPath)) {
      throw httpErr(404, 'この版では KING OF TIME を使いません');
    }
    for (const [m, rx, fn] of routes) {
      if (m !== method) continue;
      const match = rawPath.match(rx);
      if (!match) continue;
      return fn({ query, body, headers: (options && options.headers) || {} }, match);
    }
    throw new Error(`not found: ${method} ${rawPath}`);
  }

  return { handle, snapshot: S, db, rosterCsv, detailCsv };
})();

<script>
/* ShiftCraft 画面。ビルド工程を持たない素の JS。
   状態は state 1つに集約し、変更したら render() で描き直す。 */
'use strict';

const state = {
  user: null, view: 'dashboard', month: '2026-09', data: null,
  selectedDate: null, negotiation: null, kot: null, busy: null, cellMenu: null,
};

const $ = (sel, el) => (el || document).querySelector(sel);
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    e.appendChild(typeof kid === 'object' ? kid : document.createTextNode(String(kid)));
  }
  return e;
};

function toast(message, kind) {
  const box = h('div', { class: kind || '' }, message);
  $('#toast').appendChild(box);
  setTimeout(() => box.remove(), 5200);
}

async function api(path, options) {
  try {
    return await LocalBackend.handle(path, options);
  } catch (e) {
    if (e.status === 401 && !path.startsWith('/api/m/')) { state.user = null; render(); }
    throw e;
  }
}

const post = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });
const put = (p, body) => api(p, { method: 'PUT', body: JSON.stringify(body || {}) });
const del = (p) => api(p, { method: 'DELETE' });

// ---- データ取得 ----------------------------------------------------------

async function loadBootstrap() {
  state.data = await api(`/api/bootstrap?month=${state.month}`);
  state.user = state.data.user;
}

async function boot() {
  const me = await api('/api/me');
  state.user = me.user;
  if (state.user) {
    if (state.user.role === 'staff') state.view = 'my';
    await loadBootstrap();
  }
  render();
}

// ---- ユーティリティ ------------------------------------------------------

const WD = ['日', '月', '火', '水', '木', '金', '土'];
const dayNum = (d) => Number(d.slice(8));
const weekday = (d) => new Date(d + 'T00:00:00').getDay();
const typeByCode = (code) => (state.data.shiftTypes || []).find((t) => t.code === code);
const staffById = (id) => (state.data.staff || []).find((s) => s.id === id);

function planGrid() {
  const g = new Map();
  for (const a of (state.data.plan?.assignments || [])) g.set(a.staffId + '|' + a.date, a.code);
  return g;
}

function requestMap() {
  const m = new Map();
  for (const r of state.data.requests) m.set(r.staffId + '|' + r.date, r);
  return m;
}

function unmetSet() {
  const s = new Set();
  for (const u of (state.data.plan?.metrics?.unmetRequests || [])) s.add(u.staffId + '|' + u.date);
  return s;
}

async function withBusy(label, fn) {
  state.busy = label; render();
  try { return await fn(); }
  finally { state.busy = null; render(); }
}

async function pollJob(jobId, label) {
  for (;;) {
    const job = await api(`/api/jobs/${jobId}`);
    state.busy = `${label}（${Math.round(job.elapsedMs / 1000)}秒経過）${job.message ? ' — ' + job.message : ''}`;
    render();
    if (job.status === 'done') return job.result;
    if (job.status === 'failed') throw new Error(job.error);
    await new Promise((r) => setTimeout(r, 700));
  }
}

// ---- ログイン ------------------------------------------------------------

function viewLogin() {
  const form = h('form', {
    onsubmit: async (e) => {
      e.preventDefault();
      try {
        const r = await post('/api/login', {
          username: $('#u').value.trim(), password: $('#p').value,
        });
        state.user = r.user;
        state.view = r.user.role === 'staff' ? 'my' : 'dashboard';
        await loadBootstrap();
        render();
      } catch (err) { toast(err.message, 'bad'); }
    },
  },
    h('div', { class: 'field' }, h('label', { for: 'u' }, 'ID'),
      h('input', { id: 'u', autocomplete: 'username', required: true, value: 'admin' })),
    h('div', { class: 'field' }, h('label', { for: 'p' }, 'パスワード'),
      h('input', { id: 'p', type: 'password', autocomplete: 'current-password', required: true, value: 'admin' })),
    h('button', { class: 'btn primary', type: 'submit', style: 'width:100%;margin-top:6px' }, 'ログイン'));

  return h('div', { class: 'login-wrap' },
    h('div', { class: 'login-card' },
      h('h1', {}, 'ShiftCraft'),
      h('div', { class: 'sub' }, '介護シフト・勤怠・給与 連携システム'),
      form,
      h('div', { class: 'sharelede' },
        '特別養護老人ホームの勤務表を、介護福祉士・看護職員の配置基準と夜勤のルールを満たしたまま自動で作るシステムです。',
        h('br', {}),
        'KING OF TIME を使わない版です。スマホの打刻を ShiftCraft が正本として持ち、マネーフォワード給与・年末調整へ渡す形までを含みます。'),
      h('div', { class: 'hint-users' },
        h('div', {}, 'デモ用アカウント'),
        h('div', {}, h('code', {}, 'admin / admin'), ' — 管理者（施設長）'),
        h('div', {}, h('code', {}, 'sato / sato'), ' — スタッフ（佐藤 美咲）'),
        h('div', {}, h('code', {}, 'nakamura / nakamura'), ' — スタッフ（中村 拓也）'))));
}

// ---- ダッシュボード ------------------------------------------------------

function kpi(label, value, unit, sub, tone) {
  return h('div', { class: 'kpi' },
    h('div', { class: 'label' }, label),
    h('div', { class: 'value', style: tone ? `color:var(--${tone})` : null },
      value, unit ? h('span', { class: 'unit' }, unit) : null),
    sub ? h('div', { class: 'sub' }, sub) : null);
}

function viewDashboard() {
  const d = state.data;
  const plan = d.plan;
  const m = plan?.metrics || {};
  const cap = d.crowd.capacity;
  const over = d.crowd.days.filter((x) => x.level === 'over');

  const cards = h('div', { class: 'kpis' },
    kpi('在籍職員', d.staff.length, '名', `新人 ${d.staff.filter((s) => s.isNewcomer).length}名 / 夜勤可 ${d.staff.filter((s) => s.canNightShift).length}名`),
    kpi('休める上限', cap.maxOff, '名/日', `勤務${cap.requiredWorking}名 + 明け${cap.requiredAfterNight}名が必要`),
    kpi('希望休', d.requests.length, '件', over.length ? `上限超過 ${over.length}日` : '上限超過なし', over.length ? 'bad' : 'good'),
    plan
      ? kpi('希望充足', m.requestFulfillRate ?? 0, '%', `${m.requestFulfilled}/${m.requestTotal} 件`)
      : kpi('勤務表', '未生成', '', 'まだ作成されていません'),
    plan
      ? kpi('ハード制約違反', plan.hardViolations, '件', plan.hardViolations ? '確定できません' : '法令・配置基準を満たす',
        plan.hardViolations ? 'bad' : 'good')
      : null);

  const status = plan ? h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '現在の勤務表'),
      h('span', { class: `pill ${plan.status === 'confirmed' ? 'ok' : 'mute'}` },
        plan.status === 'confirmed' ? '確定済み' : '下書き'),
      h('span', { class: 'spacer' }),
      h('span', { class: 'note' }, `${plan.solverStatus} / ${(plan.solveTimeMs / 1000).toFixed(1)}秒 / 手動編集 ${plan.editedCount}回`)),
    h('div', { class: 'body' },
      h('div', { class: 'kpis' },
        kpi('夜勤の差', m.nightSpread ?? '-', '回', `${m.nightMin}〜${m.nightMax}回`),
        kpi('NGペア同席', m.ngPairTogether ?? '-', '件', '', m.ngPairTogether ? 'warn' : 'good'),
        kpi('新人フォロー', m.newcomerSupportRate ?? '-', '%', `${m.newcomerSupportOk}/${m.newcomerSupportTotal} コマ`),
        kpi('割当コマ', m.assignmentCount ?? '-', '', `${d.staff.length}名 × ${d.crowd.days.length}日`)))) : null;

  const actions = h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '次にやること')),
    h('div', { class: 'body row' },
      h('button', { class: 'btn primary', onclick: generatePlan },
        plan ? '勤務表を作り直す' : '勤務表を生成する'),
      plan ? h('button', { class: 'btn', onclick: () => { state.view = 'plan'; render(); } }, '勤務表を見る／編集する') : null,
      plan ? h('button', { class: 'btn', onclick: () => { state.view = 'negotiation'; render(); } }, '交渉候補を探す') : null,
      h('button', { class: 'btn', onclick: () => { state.view = 'requests'; render(); } }, '希望休を確認する')));

  return [cards, status, actions].filter(Boolean);
}

async function generatePlan() {
  try {
    await withBusy('生成を開始しています', async () => {
      const { jobId } = await post('/api/generate', { yearMonth: state.month });
      const result = await pollJob(jobId, '勤務表を生成中');
      await loadBootstrap();
      if (result.status === 'INFEASIBLE') {
        state.view = 'plan';
        state.infeasible = result;
        toast('この条件では作成できません。原因を診断しました。', 'bad');
      } else {
        state.infeasible = null;
        state.view = 'plan';
        toast(`生成しました（${result.solverStatus} / ${(result.solveTimeMs / 1000).toFixed(1)}秒 / 違反${result.hardViolations}件）`, 'ok');
      }
    });
  } catch (e) { toast(e.message, 'bad'); }
}

// ---- 勤務表 --------------------------------------------------------------

function viewPlan() {
  const d = state.data;
  if (state.infeasible) return viewDiagnosis(state.infeasible);
  if (!d.plan) {
    return h('div', { class: 'card' }, h('div', { class: 'body stack' },
      h('div', {}, `${state.month} の勤務表はまだありません。`),
      h('div', {}, h('button', { class: 'btn primary', onclick: generatePlan }, '勤務表を生成する'))));
  }
  const plan = d.plan;
  const grid = planGrid();
  const reqs = requestMap();
  const unmet = unmetSet();
  const dates = d.crowd.days.map((x) => x.date);
  const canEdit = state.user.role === 'admin' && plan.status !== 'confirmed';

  const head = h('tr', {}, h('th', { class: 'name' }, '職員'),
    dates.map((dt) => {
      const w = weekday(dt);
      return h('th', { class: w === 0 ? 'sun' : w === 6 ? 'sat' : '' },
        h('div', {}, dayNum(dt)), h('div', {}, WD[w]));
    }),
    h('th', { style: 'min-width:34px' }, '公休'), h('th', { style: 'min-width:34px' }, '夜勤'));

  const rows = d.staff.map((s) => h('tr', {}, h('th', { class: 'name' }, s.name),
    dates.map((dt) => {
      const code = grid.get(s.id + '|' + dt);
      const t = code ? typeByCode(code) : null;
      const key = s.id + '|' + dt;
      const cls = ['cell', reqs.has(key) ? 'req' : '', unmet.has(key) ? 'unmet' : ''].filter(Boolean).join(' ');
      return h('td', {
        class: cls,
        style: t ? `background:${t.color}${t.isHoliday ? '' : '33'}` : '',
        title: `${s.name} ${dt} ${t ? t.name : '未割当'}${reqs.has(key) ? '（希望休あり）' : ''}`,
        tabindex: canEdit ? '0' : null,
        'data-locked': null,
        onclick: canEdit ? (ev) => openCellMenu(ev, s, dt, code) : null,
      }, t ? t.symbol : '');
    }),
    h('td', { class: 'cell', style: 'font-family:var(--mono)' }, plan.metrics?.holidayCounts?.[s.name] ?? ''),
    h('td', { class: 'cell', style: 'font-family:var(--mono)' }, plan.metrics?.nightCounts?.[s.name] ?? '')));

  const legend = h('div', { class: 'legend' },
    d.shiftTypes.map((t) => h('span', {},
      h('i', { class: 'sw', style: `background:${t.color}${t.isHoliday ? '' : '33'}` }), t.name)),
    h('span', {}, '● 希望休あり'),
    h('span', { style: 'color:var(--bad)' }, '□ 赤枠 = 希望が通らなかったコマ'));

  const violations = plan.violationDetails.length ? h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '制約違反'),
      h('span', { class: 'pill bad' }, `${plan.hardViolations}件`)),
    h('div', { class: 'body stack' },
      plan.violationDetails.slice(0, 20).map((v) => h('div', { class: 'msgbox' }, v)))) : null;

  const bar = h('div', { class: 'card' }, h('div', { class: 'body row' },
    h('span', { class: `pill ${plan.hardViolations ? 'bad' : 'ok'}` },
      plan.hardViolations ? `違反 ${plan.hardViolations}件` : '違反 0件'),
    h('span', { class: 'pill mute' }, `希望 ${plan.metrics.requestFulfilled}/${plan.metrics.requestTotal}（${plan.metrics.requestFulfillRate}%）`),
    h('span', { class: 'pill mute' }, `${plan.solverStatus} ${(plan.solveTimeMs / 1000).toFixed(1)}秒`),
    h('span', { class: 'spacer' }),
    canEdit ? h('button', { class: 'btn', onclick: generatePlan }, '作り直す') : null,
    canEdit ? h('button', {
      class: 'btn primary', disabled: plan.hardViolations > 0,
      onclick: async () => {
        try {
          await post(`/api/plans/${plan.id}/confirm`);
          await loadBootstrap(); render();
          toast('確定しました。未充足の履歴を保存し、翌月の公平性補正に反映します。', 'ok');
        } catch (e) { toast(e.message, 'bad'); }
      },
    }, '確定する') : null,
    plan.status === 'confirmed' ? h('span', { class: 'pill ok' }, '確定済み') : null));

  return [bar, violations,
    h('div', { class: 'card' },
      h('header', {}, h('h3', {}, `${state.month} 勤務表`),
        h('span', { class: 'note' }, canEdit ? 'セルをクリックすると勤務区分を変更でき、その場で制約を再チェックします' : '確定済みのため編集できません')),
      h('div', { class: 'grid-wrap' },
        h('table', { class: 'grid' }, h('thead', {}, head), h('tbody', {}, rows))),
      legend)].filter(Boolean);
}

function openCellMenu(ev, staff, date, current) {
  const existing = $('#cellmenu');
  if (existing) existing.remove();
  const menu = h('div', {
    id: 'cellmenu',
    style: `position:absolute;z-index:50;background:var(--surface);border:1px solid var(--border-strong);
            border-radius:8px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px;min-width:120px`,
  }, h('div', { class: 'muted', style: 'padding:2px 8px' }, `${staff.name} ${date.slice(5)}`),
    state.data.shiftTypes.map((t) => h('button', {
      class: 'btn sm', style: `text-align:left;border:0;${t.code === current ? 'font-weight:700' : ''}`,
      onclick: async () => {
        menu.remove();
        try {
          const r = await post(`/api/plans/${state.data.plan.id}/edit`,
            { staffId: staff.id, date, code: t.code });
          state.data.plan = r.plan;
          render();
          if (r.check.hardViolations) {
            toast(`${r.check.hardViolations}件の制約違反が発生しました: ${r.check.violationDetails[0]}`, 'bad');
          } else {
            toast('変更しました。制約違反はありません。', 'ok');
          }
        } catch (e) { toast(e.message, 'bad'); }
      },
    }, h('span', { class: 'sw', style: `display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;background:${t.color}` }), t.name)));
  document.body.appendChild(menu);
  const r = ev.target.getBoundingClientRect();
  menu.style.left = Math.min(r.left + window.scrollX, window.innerWidth - 160) + 'px';
  menu.style.top = (r.bottom + window.scrollY + 3) + 'px';
  setTimeout(() => document.addEventListener('click', function close() {
    menu.remove(); document.removeEventListener('click', close);
  }), 0);
}

            `${date} はすでに${day.requestCount}名が希望を出しています。\n` +

        r.priority === 'required' ? '絶対' : 'できれば')),
      h('td', { style: 'text-align:right' }, h('button', {
        class: 'btn sm', onclick: async () => {
          try { await del(`/api/requests/${r.id}`); await loadBootstrap(); render(); }
          catch (e) { toast(e.message, 'bad'); }
        },
      }, '取消')))))));

  return [
    h('div', { class: 'card' },
      h('header', {}, h('h3', {}, '日別の希望休集中度'),
        h('span', { class: 'note' }, `休める上限は1日あたり ${cap.maxOff}名（在籍${d.staff.length} − 勤務${cap.requiredWorking} − 明け${cap.requiredAfterNight}）`)),
      h('div', { class: 'body stack' },

          h('span', {}, h('i', { class: 'sw', style: 'background:var(--warn-soft);border:1px solid var(--warn)' }), '上限ちょうど／間近'),

        h('span', { class: 'note' }, '上限を超える日には申請時に警告が出ます')),
      h('div', { class: 'body' }, form)),

function viewNegotiation() {
  const d = state.data;
  if (!d.plan) return h('div', { class: 'card' }, h('div', { class: 'body' }, '先に勤務表を生成してください。'));
  const unmetByDate = d.plan.metrics?.unmetByDate || {};
  const dates = Object.keys(unmetByDate).sort();
  const neg = state.negotiation;

  const picker = h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '希望が通らなかった日'),
      h('span', { class: 'note' }, `${dates.length}日`)),
    h('div', { class: 'body row' }, dates.length ? dates.map((dt) => h('button', {
      class: `btn sm${neg && neg.conflict.date === dt ? ' primary' : ''}`,
      onclick: () => loadNegotiation(dt),
    }, `${dt.slice(5)}（${unmetByDate[dt].length}名）`)) : h('span', { class: 'muted' }, '未充足はありません')));

  const pending = d.negotiations.filter((n) => n.status === 'pending');
  const accepted = d.negotiations.filter((n) => n.status === 'accepted' && !n.applied);

  const threads = d.negotiations.length ? h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '相談の状況'),
      h('span', { class: 'note' }, `依頼${d.negotiations.length}件 / 未返答${pending.length}件`),
      h('span', { class: 'spacer' }),
      accepted.length ? h('button', {
        class: 'btn primary', onclick: async () => {
          try {
            await withBusy('承諾を反映しています', async () => {
              const r = await post(`/api/plans/${d.plan.id}/regenerate`);
              const before = d.plan.metrics.requestFulfillRate;
              const result = await pollJob(r.jobId, '再生成中');
              await loadBootstrap(); state.negotiation = null;
              toast(`${r.appliedCount}件を反映して再生成しました（充足率 ${before}% → ${result.metrics.requestFulfillRate}%）`, 'ok');
            });
          } catch (e) { toast(e.message, 'bad'); }
        },
      }, `承諾${accepted.length}件を反映して再生成`) : null),
    h('div', { class: 'body stack' }, d.negotiations.map((n) => h('div', { class: 'cand' },
      h('div', { class: 'head' },
        h('strong', {}, n.staffName), h('span', { class: 'muted' }, `${n.date}`),
        h('span', { class: `pill ${n.status === 'accepted' ? 'ok' : n.status === 'declined' ? 'bad' : 'mute'}` },
          n.status === 'accepted' ? '承諾' : n.status === 'declined' ? '辞退' : '返答待ち'),
        n.applied ? h('span', { class: 'pill mute' }, '反映済み') : null,
        h('span', { class: 'spacer' }),
        n.altDate ? h('span', { class: 'muted' }, `代替日 ${n.altDate}`) : null),
      n.reply ? h('div', { class: 'muted' }, `返答: ${n.reply}`) : null,
      n.status === 'pending' ? h('div', { class: 'row' },
        h('span', { class: 'muted' }, '本人からの返答を、電話や口頭で受けた内容として記録:'),
        h('button', {
          class: 'btn sm primary', onclick: async () => {
            try {
              await post(`/api/negotiations/${n.id}/respond`, { status: 'accepted', reply: '承諾しました' });
              await loadBootstrap(); render();
              toast(`${n.staffName} さんの承諾を記録しました`, 'ok');
            } catch (e) { toast(e.message, 'bad'); }
          },
        }, '承諾として記録'),
        h('button', {
          class: 'btn sm', onclick: async () => {
            try {
              await post(`/api/negotiations/${n.id}/respond`, { status: 'declined', reply: '難しいとのことでした' });
              await loadBootstrap(); render();
              toast(`${n.staffName} さんの辞退を記録しました`, 'ok');
            } catch (e) { toast(e.message, 'bad'); }
          },
        }, '辞退として記録')) : null)))) : null;

  const detail = neg ? h('div', { class: 'card' },
    h('header', {}, h('h3', {}, `${neg.conflict.date} の相談候補`),
      h('span', { class: 'note' }, `${neg.candidates.length}名`)),
    h('div', { class: 'body stack' },
      h('div', { class: 'msgbox' }, neg.conflict.explanation),
      neg.candidates.map((c, i) => h('div', { class: `cand${i === 0 ? ' top' : ''}` },
        h('div', { class: 'head' },
          h('span', { class: 'score' }, c.score),
          h('strong', {}, c.staffName),
          h('span', { class: `pill ${c.priority === 'required' ? 'warn' : 'mute'}` },
            c.priority === 'required' ? '絶対' : 'できれば'),
          h('span', { class: 'muted' }, `休${c.holidayCount}日 / 夜勤${c.nightCount}回 / 過去未充足${c.unfulfilledCount}回`),
          h('span', { class: 'spacer' }),
          h('button', {
            class: 'btn sm', onclick: async () => {
              try {
                await post('/api/negotiations', {
                  planId: state.data.plan.id, staffId: c.staffId, date: neg.conflict.date,
                  kind: c.alternatives.length ? 'reschedule' : 'withdraw',
                  altDate: c.alternatives[0]?.date || null, score: c.score, message: c.message,
                });
                await loadBootstrap(); render();
                toast(`${c.staffName} さんへ相談を送りました`, 'ok');
              } catch (e) { toast(e.message, 'bad'); }
            },
          }, 'この人に相談する')),
        c.reasons.length ? h('ul', {}, c.reasons.map((r) => h('li', {}, r))) : null,
        c.cautions.length ? h('ul', { class: 'caution' }, c.cautions.map((r) => h('li', {}, r))) : null,
        h('details', {}, h('summary', { class: 'muted' }, '依頼文面'),
          h('div', { class: 'msgbox', style: 'margin-top:6px' }, c.message)))))) : null;

  return [picker, detail, threads].filter(Boolean);
}

    h('header', {}, h('h3', {}, 'あなたへの相談')),
    h('div', { class: 'body stack' }, myNegos.map((n) => h('div', { class: 'cand' },
      h('div', { class: 'msgbox' }, n.message),
      n.status === 'pending' ? h('div', { class: 'row' },
        h('button', {
          class: 'btn primary sm', onclick: () => respond(n.id, 'accepted'),
        }, n.altDate ? `${n.altDate} に変更で承諾` : '取り下げて承諾'),
        h('button', { class: 'btn sm', onclick: () => respond(n.id, 'declined') }, '難しい')) :
        h('span', { class: `pill ${n.status === 'accepted' ? 'ok' : 'bad'}` },
          n.status === 'accepted' ? '承諾済み' : '辞退')))) ) : null;

  const myGrid = plan && plan.status === 'confirmed' ? h('div', { class: 'card' },
    h('header', {}, h('h3', {}, `${state.month} の確定シフト`), h('span', { class: 'pill ok' }, '確定')),
    h('div', { class: 'body tight scroll' }, h('table', { class: 'grid' },
      h('thead', {}, h('tr', {}, h('th', { class: 'name' }, '日'),
        d.crowd.days.map((x) => h('th', { class: weekday(x.date) === 0 ? 'sun' : weekday(x.date) === 6 ? 'sat' : '' },

      h('tbody', {}, h('tr', {}, h('th', { class: 'name' }, me ? me.name : '自分'),
        d.crowd.days.map((x) => {

      '勤務表はまだ確定していません。確定するとここに表示されます。'));

      await loadBootstrap(); render();

function kotSyncTab(plan) {
  const diff = state.kotDiff;

      h('span', { class: `pill ${plan.status === 'confirmed' ? 'ok' : 'warn'}` },

    h('div', { class: 'body row' },
      h('button', {
        class: 'btn', onclick: async () => {
          try {
            state.kotPing = await api('/api/kot/ping');
            render();
            toast(state.kotPing.ok ? `接続できました（${state.kotPing.elapsedMs}ms）` : `接続できません: ${state.kotPing.error}`,

      }, '接続テスト'),
      h('button', {
        class: 'btn', onclick: async () => {

      h('button', {
        class: 'btn primary', disabled: plan.status !== 'confirmed',

          try {
            await withBusy('KING OF TIME へ送信しています', async () => {
              const { jobId } = await post(`/api/plans/${plan.id}/kot/sync`, {});
              const r = await pollJob(jobId, 'KING OF TIME へ送信中');
              state.kotResult = r;
              state.kotDiff = await api(`/api/plans/${plan.id}/kot/diff`);
              state.kotRuns = (await api('/api/kot/runs')).runs;
              toast(`${r.total}件を送信しました（新規${r.created} / 更新${r.updated} / 失敗${r.failed}・${r.elapsedMs}ms）`,
                r.failed ? 'bad' : 'ok');
            });
          } catch (e) { toast(e.message, 'bad'); }
        },
      }, '勤務予定を送信'),
      state.kotPing ? h('span', { class: `pill ${state.kotPing.ok ? 'ok' : 'bad'}` },
        `${state.kotPing.ok ? '接続OK' : '接続NG'} ${state.kotPing.status} / ${state.kotPing.elapsedMs}ms`) : null));

  const diffCard = diff && diff.summary ? h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '差分'),
      h('span', { class: 'note' }, '相手側の現在値を取得して比較します。同じ内容は送りません。')),
    h('div', { class: 'body' }, h('div', { class: 'kpis' },

      kpi('変更', diff.summary.changed, '件', '', diff.summary.changed ? 'warn' : null),
      kpi('変更なし', diff.summary.same, '件', '送信を省略'),
      kpi('送信対象外', diff.summary.skipped, '件', '休・明けは打刻対象外')))) : null;

  const result = state.kotResult ? h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '直近の送信結果'),
      h('span', { class: `pill ${state.kotResult.failed ? 'bad' : 'ok'}` },
        state.kotResult.status === 'done' ? '全件成功' : '一部失敗'),
      h('span', { class: 'note' }, `${state.kotResult.batches}バッチ / ${state.kotResult.elapsedMs}ms`)),
    h('div', { class: 'body tight scroll' }, h('table', { class: 'data' },
      h('thead', {}, h('tr', {}, h('th', {}, 'バッチ'), h('th', {}, '件数'), h('th', {}, 'HTTP'),
        h('th', {}, '新規'), h('th', {}, '更新'), h('th', {}, '失敗'), h('th', {}, '所要'))),
      h('tbody', {}, state.kotResult.log.map((l) => h('tr', {},
        h('td', {}, l.batch), h('td', { class: 'num' }, l.count),
        h('td', {}, h('span', { class: `pill ${l.status === 200 ? 'ok' : 'bad'}` }, l.status || 'ERR')),
        h('td', { class: 'num' }, l.created ?? '—'), h('td', { class: 'num' }, l.updated ?? '—'),
        h('td', { class: 'num' }, l.failed ?? '—'), h('td', { class: 'num' }, `${l.elapsedMs}ms`)))))) ) : null;

  const history = runs && runs.length ? h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '送信履歴')),
    h('div', { class: 'body tight scroll' }, h('table', { class: 'data' },
      h('thead', {}, h('tr', {}, h('th', {}, '日時'), h('th', {}, '対象月'), h('th', {}, '状態'),
        h('th', {}, '件数'), h('th', {}, '新規'), h('th', {}, '更新'), h('th', {}, '失敗'))),
      h('tbody', {}, runs.map((r) => h('tr', {},
        h('td', {}, r.createdAt), h('td', {}, r.yearMonth),

        h('td', { class: 'num' }, r.total), h('td', { class: 'num' }, r.created),
        h('td', { class: 'num' }, r.updated), h('td', { class: 'num' }, r.failed)))))) ) : null;

  return [status, diffCard, result, history].filter(Boolean);
}

async function loadKotConfig() {

    state.kotConfig = c.config; state.kotRuns = runs.runs;

  finally { state.kotLoading = false; render(); }

  const history = runs && runs.length ? h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '連携履歴')),
    h('div', { class: 'body tight scroll' }, h('table', { class: 'data' },

// ---- 本日の状況（スマホ連携）--------------------------------------------
// スマホで押すと右が変わる。電話枠は描き直しのたびに作り直さず、同じ DOM を載せ替える
// （作り直すと入力中の日報やログイン状態が消えるため）。

const STATUS_LABEL = {
  working: ['出勤中', 'ok'], done: ['退勤済み', 'acc'], pending: ['これから', 'mute'],
  planned: ['予定', 'mute'], alert: ['未打刻', 'bad'], noout: ['退勤未打刻', 'bad'], absent: ['打刻なし', 'bad'],
};

function ensurePhone() {
  if (state.phone) return state.phone;
  const screen = h('div', { class: 'phone-screen' });
  const frame = h('div', { class: 'phone' }, h('div', { class: 'phone-notch' }), screen);
  const inst = MobileApp.mount(screen, {
    persist: false, noDeviceApis: true, api: (p, o) => api(p, o),
    onChange: () => refreshBoard(),
  });
  state.phone = { frame, inst };
  return state.phone;
}

async function refreshBoard() {
  if (state.view !== 'today' || !state.user || state.user.role !== 'admin') return;
  try {
    [state.board, state.todayReports] = await Promise.all([api('/api/today/board'), api('/api/today/reports')]);
  } catch (e) { return; }
  const box = $('#board');
  if (!box) { render(); return; }  // 初回は枠がまだ無いので描き直す
  box.textContent = ''; boardBody().forEach((n) => box.appendChild(n));
  const clk = $('#board-clock');
  if (clk) clk.textContent = `${state.board.clock.today}　${state.board.clock.hhmm}`;
}
setInterval(() => { if (state.view === 'today' && !state.busy) refreshBoard(); }, 3000);

async function demoClock(body) {
  try { await post('/api/demo/clock', body); } catch (e) { toast(e.message, 'bad'); }
  await refreshBoard(); state.phone && state.phone.inst.refresh();
}

function boardBody() {
  const b = state.board;
  if (!b) return [h('div', { class: 'muted' }, '読み込み中…')];
  const sm = b.summary;
  const tile = (label, v, sub, kind) => h('div', { class: `tile ${kind || ''}` },
    h('div', { class: 'lbl' }, label), h('div', { class: 'val' }, String(v)), h('div', { class: 'sub' }, sub || ''));
  const tiles = h('div', { class: 'tiles' },
    tile('勤務者', sm.onDuty, sm.prevNight ? `うち夜勤明け ${sm.prevNight}名` : '名'),
    tile('出勤中', sm.working, `退勤済み ${sm.done}名`, 'good'),
    tile('これから', sm.pending, '名'),
    tile('要確認', sm.alerts, sm.alerts ? '未打刻の人がいます' : 'なし', sm.alerts ? 'bad' : ''),
    tile('遅刻', sm.late, '名', sm.late ? 'warn' : ''),
    tile('日報', `${sm.reports}/${sm.onDuty}`, sm.hiyari ? `ヒヤリ ${sm.hiyari}件` : '提出済み/勤務者',
      sm.hiyari ? 'warn' : ''));

  const rows = b.rows.map((r) => {
    const [label, kind] = STATUS_LABEL[r.status] || [r.status, 'mute'];
    return h('tr', { class: ['alert', 'absent', 'noout'].includes(r.status) ? 'row-alert' : '' },
      h('td', { style: 'white-space:nowrap' }, h('span', { class: 'sym', style: `background:${r.color}` }, r.symbol), ' ', r.name),
      h('td', { class: 'mono' }, r.start
        ? (r.isPrevNight ? `昨夜 ${r.start}〜今朝 ${r.end}` : `${r.start}〜${r.end < r.start ? '翌' : ''}${r.end}`)
        : '予定外'),
      h('td', { class: 'mono' }, r.clockIn || '—',
        r.lateMinutes ? h('span', { class: 'pill warn', style: 'margin-left:6px' }, `遅刻${r.lateMinutes}分`) : null),
      h('td', { class: 'mono' }, r.clockOut || '—',
        r.overtimeMinutes ? h('span', { class: 'pill warn', style: 'margin-left:6px' }, `残業${r.overtimeMinutes}分`) : null),
      h('td', {}, h('span', { class: `pill ${kind}` }, label),
        r.source === 'mobile' ? h('span', { class: 'pill acc', style: 'margin-left:4px' }, 'スマホ') : null),
      h('td', {}, r.report
        ? [h('span', { class: 'pill ok' }, '提出'), r.report.hasHiyari ? h('span', { class: 'pill bad', style: 'margin-left:4px' }, 'ヒヤリ') : null]
        : h('span', { class: 'muted' }, '未提出')));
  });
  const table = h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '勤務者の状況'), h('span', { class: 'note' }, '要確認が上。昨夜の夜勤（今朝まで）も含みます')),
    h('div', { class: 'body', style: 'padding:0;overflow:auto' }, h('table', { class: 'data' },
      h('thead', {}, h('tr', {}, ['名前', '予定', '出勤', '退勤', '状態', '日報'].map((x) => h('th', {}, x)))),
      h('tbody', {}, rows))));

  const unsent = b.rows.filter((r) => !r.report && r.status !== 'planned');
  const reports = state.todayReports ? state.todayReports.reports : [];
  const reportCard = h('div', { class: 'card' },
    h('header', {}, h('h3', {}, '日報'),
      h('span', { class: 'note' }, '夜勤明けの前日分（昨夜の夜勤の日報）も含みます')),
    h('div', { class: 'body stack' },
      h('div', {}, h('b', {}, '未提出：'),
        unsent.length ? unsent.map((r) => h('span', { class: 'pill warn', style: 'margin:2px 4px 2px 0' }, r.name))
          : h('span', { class: 'muted' }, 'なし')),
      reports.length ? reports.map((r) => h('div', { class: 'rep' },
        h('div', { class: 'row' }, h('b', {}, r.staffName), h('span', { class: 'muted' }, `${r.date.slice(5).replace('-', '/')} ${r.shiftName}`),
          r.hasHiyari ? h('span', { class: 'pill bad' }, 'ヒヤリあり') : null,
          h('span', { class: 'spacer' }), h('span', { class: 'note' }, (r.updatedAt || '').slice(11, 16))),
        h('div', { class: 'rep-w' }, r.work),
        r.handover ? h('div', { class: 'note' }, '申し送り：' + r.handover) : null,
        r.hasHiyari ? h('div', { class: 'note', style: 'color:var(--bad)' }, 'ヒヤリ：' + r.hiyari) : null))
        : h('div', { class: 'muted' }, 'まだ今日の日報は届いていません。左のスマホから書いてみてください。')));

  const out = [tiles, table];
  if (b.kot) {
    out.push(h('div', { class: 'card' },
      h('header', {}, h('h3', {}, 'KING OF TIME 側に届いた打刻'),
        h('span', { class: `pill ${b.kot.ok ? 'ok' : 'bad'}` }, b.kot.ok ? '接続OK' : '接続NG'),
        h('span', { class: 'note' }, `本日 ${b.kot.count}件。スマホの打刻は POST /daily-workings/timerecord で渡しています`)),
      h('div', { class: 'body', style: 'padding:0;overflow:auto' }, h('table', { class: 'data' },
        h('thead', {}, h('tr', {}, ['職員', '区分', '時刻', '経路'].map((x) => h('th', {}, x)))),
        h('tbody', {}, b.kot.records.map((r) => h('tr', {},
          h('td', {}, r.staffName), h('td', {}, r.kind === 'in' ? '出勤' : '退勤'),
          h('td', { class: 'mono' }, (r.time || '').slice(11, 16)),
          h('td', {}, h('span', { class: `pill ${r.source === 'shiftcraft-mobile' ? 'acc' : 'mute'}` },
            r.source === 'shiftcraft-mobile' ? 'ShiftCraftスマホ' : (r.source === 'seed' ? '打刻機(デモ)' : r.source))))))))));
  }
  out.push(reportCard);
  return out;
}

      ? h('span', { class: `pill ${state.data.plan.hardViolations ? 'bad' : 'ok'}` },
        state.data.plan.hardViolations ? `違反${state.data.plan.hardViolations}件` : '制約違反0件')
      : h('span', { class: 'pill mute' }, '勤務表 未生成'));

  root.appendChild(h('div', { class: 'sharenote' },
    h('strong', {}, '共有版'),
    'スマホの出退勤・日報、ハード制約の検証、交渉候補のスコアリング、予定と打刻の突合、マネーフォワード給与の給与試算、'
    + '年末調整の書類回収状況は、このページ内で実際に動いています。'
    + 'シフトの求解（CP-SAT）だけはローカルで実測した結果を再生しています。'));
  root.appendChild(h('div', { class: 'app' }, side,
    h('div', { class: 'main' }, top,
      h('div', { class: 'content' }, Array.isArray(body) ? body : [body]))));

  if (state.busy) {
    root.appendChild(h('div', { class: 'overlay' },
      h('div', { class: 'box' }, h('div', { class: 'spin' }),
        h('div', {}, state.busy),
        /生成/.test(state.busy || '')
          ? h('div', { class: 'muted', style: 'margin-top:6px' },
            '20名×31日の求解には40〜45秒かかります') : null)));
  }
}

if (window.innerWidth < 640 && !location.hash.includes('admin')) {
  document.body.classList.add('mob-page');
  MobileApp.mount(document.getElementById('root'), { persist: false, noDeviceApis: true, api: (p, o) => api(p, o) });
} else boot().catch((e) => { console.error(e); toast(e.message, 'bad'); render(); });

</script>
</body>
</html>
